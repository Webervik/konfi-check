<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konfi-Check ✓</title>
  <meta name="description" content="Quiz-App für Konfirmanden der Gemeinden Staaken" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<!-- ===== STARTSCREEN ===== -->
<div id="screen-start" class="screen active">
  <div class="app-header">
    <div class="app-title">Konfi<span>-Check</span> ✓</div>
    <div class="app-subtitle">Was weißt du über Glauben & Gemeinde?</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="input-name">Dein Name</label>
      <input type="text" id="input-name" placeholder="Wie heißt du?" autocomplete="off" maxlength="30" />
    </div>

    <div class="form-group">
      <label>Deine Gruppe</label>
      <div class="gruppe-grid" id="gruppe-grid">
        <button class="gruppe-btn" data-gruppe="Staaken Dorfkirche">
          ⛪ Staaken<br>Dorfkirche
        </button>
        <button class="gruppe-btn" data-gruppe="Staaken Gartenstadt">
          🌳 Staaken<br>Gartenstadt
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Thema wählen</label>
      <div class="themen-grid" id="themen-grid">
        <!-- wird per JS befüllt -->
      </div>
    </div>

    <button class="btn btn-primary" id="btn-start">
      Los geht's! 🚀
    </button>

    <button class="btn" id="btn-scores"
      style="margin-top:12px; width:100%; background:rgba(0,0,0,0.06); color:#555;">
      🏆 Scoreboard ansehen
    </button>
  </div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="screen-quiz" class="screen">
  <div style="width:100%; max-width:600px;">
    <div class="quiz-meta" id="quiz-meta"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="quiz-card" id="quiz-card">
    <!-- wird per JS befüllt -->
  </div>
</div>

<!-- ===== ERGEBNIS SCREEN ===== -->
<div id="screen-ergebnis" class="screen">
  <div class="app-header">
    <div class="app-title">Ergebnis</div>
  </div>
  <div class="card" style="text-align:center; max-width:420px;">
    <div class="ergebnis-emoji" id="ergebnis-emoji">🎉</div>
    <div class="ergebnis-score" id="ergebnis-score">0/7</div>
    <div class="ergebnis-text" id="ergebnis-text"></div>
    <div class="ergebnis-actions">
      <button class="btn btn-primary" id="btn-scores-from-result">🏆 Scoreboard ansehen</button>
      <button class="btn btn-secondary" id="btn-nochmal">🔁 Nochmal versuchen</button>
      <button class="btn" id="btn-zum-start"
        style="background:rgba(0,0,0,0.06); color:#555;">
        🏠 Zurück zum Start
      </button>
    </div>
  </div>
</div>

<!-- ===== SCORES SCREEN ===== -->
<div id="screen-scores" class="screen">

  <!-- Duell-Banner -->
  <div class="duell-banner">
    <div class="duell-gruppe">
      <div class="duell-gruppe-name">⛪ Staaken Dorfkirche</div>
      <div class="duell-avg" id="duell-avg-0">–</div>
    </div>
    <div class="duell-vs">VS</div>
    <div class="duell-gruppe">
      <div class="duell-gruppe-name">🌳 Staaken Gartenstadt</div>
      <div class="duell-avg" id="duell-avg-1">–</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="gruppe-tabs">
    <button class="gruppe-tab active" data-filter="alle">Alle</button>
    <button class="gruppe-tab" data-filter="Staaken Dorfkirche">⛪ Dorfkirche</button>
    <button class="gruppe-tab" data-filter="Staaken Gartenstadt">🌳 Gartenstadt</button>
  </div>

  <!-- Liste -->
  <div class="score-list" id="score-list">
    <div class="loading"><div class="spinner"></div>Lade…</div>
  </div>

  <button class="btn" id="btn-back-scores"
    style="margin-top:20px; background:rgba(255,255,255,0.15); color:#fff; width:100%; max-width:600px;">
    ← Zurück
  </button>

  <button id="btn-eintraege-entfernen"
    style="margin-top:8px; width:100%; max-width:600px; background:transparent; border:none; color:transparent; cursor:default; user-select:text; font-size:1px;">
    eintraege entfernen
  </button>

</div>

<!-- Konfetti-Container -->
<div class="konfetti" id="konfetti"></div>

<script>window.FRAGEN_DATA = {"themen":[{"id":"pfingsten","titel":"Pfingsten","icon":"🕊️","farbe":"#e67e22","fragen":[{"id":"pf1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wann feiern Christen Pfingsten?","antworten":["25 Tage nach Ostern","50 Tage nach Ostern","40 Tage nach Ostern","7 Wochen nach Weihnachten"],"richtig":1,"erklaerung":"Der Name kommt vom griechischen »Pentekoste« — der 50. Tag nach Ostern.","bibelstelle":null,"bibellink":null},{"id":"pf2","typ":"multiple-choice","schwierigkeit":1,"frage":"Was passierte laut Bibel an Pfingsten?","antworten":["Jesus erschien den Jüngern","Der Heilige Geist kam auf die Jünger herab","Jesus fuhr in den Himmel auf","Die Jünger fasteten 40 Tage"],"richtig":1,"erklaerung":"Wind, Feuer, Zungenreden — der Heilige Geist kam auf die versammelten Jünger.","bibelstelle":"Apg 2,1-4","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.1-ACT.2.4"},{"id":"pf3","typ":"luecke","schwierigkeit":2,"frage":"Ergänze: Pfingsten wird der »___ der Kirche« genannt.","antworten":["Todestag","Geburtstag","Jahrestag","Namenstag"],"richtig":1,"erklaerung":"An diesem Tag entstand die erste Gemeinde — Menschen hörten die Botschaft und schlossen sich zusammen.","bibelstelle":"Apg 2,41","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.41-ACT.2.41"},{"id":"pf4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wie viele Menschen ließen sich laut Bibel an Pfingsten taufen?","antworten":["120","500","3000","12"],"richtig":2,"erklaerung":"Apg 2,41: »An diesem Tag kamen etwa dreitausend Menschen hinzu.«","bibelstelle":"Apg 2,41","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.41-ACT.2.41"},{"id":"pf5","typ":"bild","schwierigkeit":2,"frage":"Was stellt diese Taube in der christlichen Kunst dar?","bild":"assets/pfingsten.jpg","bildalt":"Fresko aus der Wiener Karlskirche (18. Jh.) — Taube als Symbol des Heiligen Geistes mit Lichtstrahlen","antworten":["Den Frieden nach der Sintflut","Den Heiligen Geist","Die Seele Marias","Einen Engel Gottes"],"richtig":1,"erklaerung":"Die Taube ist das klassische Symbol des Heiligen Geistes — schon bei Jesu Taufe erschien er so. Dieses Fresko aus der Wiener Karlskirche (18. Jh.) zeigt ihn mit goldenen Lichtstrahlen.","bibelstelle":"Mt 3,16","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.3.16-MAT.3.16"},{"id":"pf6","typ":"multiple-choice","schwierigkeit":3,"frage":"Welches jüdische Fest fiel auf denselben Tag wie das biblische Pfingsten?","antworten":["Pessach","Schawuot (Wochenfest)","Jom Kippur","Sukkot"],"richtig":1,"erklaerung":"Schawuot erinnert an die Gabe der Tora am Sinai — Lukas setzt bewusst Pfingsten an diesen Tag: Gottes Geist ersetzt das Gesetz.","bibelstelle":"Apg 2,1","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.1-ACT.2.1"},{"id":"pf7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was bedeutet theologisch »Heiliger Geist« in der Dreieinigkeit?","antworten":["Ein Engel Gottes","Die dritte Person der Trinität","Das Gewissen des Menschen","Die Bibel selbst"],"richtig":1,"erklaerung":"Vater, Sohn, Heiliger Geist — drei Personen, ein Gott. Das Trinitätsdogma wurde im 4. Jh. formuliert.","bibelstelle":"Mt 28,19","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.28.19-MAT.28.19"}],"zitate":[{"text":"„Auf einmal gab es vom Himmel her ein Rauschen, wie wenn ein heftiger Sturm aufkommt.“","quelle":"Apg 2,2","link":"https://www.die-bibel.de/bibel/BB/ACT.2.2-ACT.2.2"},{"text":"„Sie wurden alle vom Heiligen Geist erfüllt.“","quelle":"Apg 2,4","link":"https://www.die-bibel.de/bibel/BB/ACT.2.4-ACT.2.4"},{"text":"„Ich werde meinen Geist über alle Menschen ausgießen.“","quelle":"Apg 2,17","link":"https://www.die-bibel.de/bibel/BB/ACT.2.17-ACT.2.17"}]},{"id":"gemeinde","titel":"Gemeinde","icon":"🫀","farbe":"#8e44ad","fragen":[{"id":"gm1","typ":"multiple-choice","schwierigkeit":1,"frage":"Mit welchem Bild beschreibt Paulus die Gemeinde?","antworten":["Als ein Schiff auf hoher See","Als einen Leib mit vielen Gliedern","Als einen Baum mit vielen Ästen","Als eine Herde mit einem Hirten"],"richtig":1,"erklaerung":"Paulus vergleicht die Gemeinde mit einem menschlichen Körper — viele Teile, aber ein Ganzes.","bibelstelle":"1 Kor 12,12","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.12-1CO.12.12"},{"id":"gm2","typ":"luecke","schwierigkeit":1,"frage":"»Ihr seid der ___ Christi und jeder einzelne ein Glied davon.« (1 Kor 12,27)","antworten":["Geist","Leib","Name","Weg"],"richtig":1,"erklaerung":"Paulus sagt klar: Die Gemeinde IST der Leib Christi — nicht nur ein Bild, sondern eine Wirklichkeit.","bibelstelle":"1 Kor 12,27","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.27-1CO.12.27"},{"id":"gm3","typ":"multiple-choice","schwierigkeit":2,"frage":"Wer ist laut Paulus das »Haupt« des Leibes — also der Gemeinde?","antworten":["Der Bischof","Der Pfarrer","Christus","Der Kirchenvorstand"],"richtig":2,"erklaerung":"Nicht eine Amtsperson, sondern Christus selbst ist das Haupt. Alle anderen dienen — sie leiten nicht aus eigener Macht.","bibelstelle":"Eph 4,15","bibellink":"https://www.die-bibel.de/bibel/BB/EPH.4.15-EPH.4.15"},{"id":"gm4","typ":"multiple-choice","schwierigkeit":2,"frage":"Was passiert laut Paulus, wenn ein Glied des Leibes leidet?","antworten":["Es wird abgetrennt","Alle anderen leiden mit","Das Haupt entscheidet allein","Das Glied muss sich selbst helfen"],"richtig":1,"erklaerung":"Gemeinde bedeutet Solidarität — kein »das ist dein Problem«. Schmerz eines Gliedes betrifft den ganzen Leib.","bibelstelle":"1 Kor 12,26","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.26-1CO.12.26"},{"id":"gm5","typ":"bild","schwierigkeit":2,"frage":"Was sagt Paulus über Glieder, die uns »schwächer« erscheinen?","bild":"assets/leib.jpg","bildalt":"Betende Hände (Albrecht Dürer, 1508) — Symbol für Gemeinschaft und Füreinander-Eintreten","antworten":["Sie können ausgetauscht werden","Sie sind unentbehrlich","Sie stören den Leib","Sie müssen stärker werden"],"richtig":1,"erklaerung":"Paulus dreht die Logik um: Gerade die scheinbar schwachen Glieder sind nötig. Kein Mensch ist in der Gemeinde überflüssig.","bibelstelle":"1 Kor 12,22","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.22-1CO.12.22"},{"id":"gm6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was nennt Paulus »Charismen«?","antworten":["Kirchliche Ämter","Persönliche Talente zum Selbstverwirklichen","Gaben des Geistes für den Dienst an anderen","Besondere Verdienste um die Kirche"],"richtig":2,"erklaerung":"Charismen sind nicht Privatbesitz — sie kommen vom Geist und sind für die Gemeinschaft bestimmt. Jedes Glied hat eine Gabe.","bibelstelle":"1 Kor 12,4-7","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.4-1CO.12.7"},{"id":"gm7","typ":"multiple-choice","schwierigkeit":3,"frage":"Welchen »noch besseren Weg« zeigt Paulus direkt nach dem Bild vom Leib?","antworten":["Das Gebet","Die Liebe","Den Gottesdienst","Die Bibellektüre"],"richtig":1,"erklaerung":"1 Kor 13 folgt direkt: Alle Charismen ohne Liebe sind nichts. Die Liebe ist das Band, das den Leib zusammenhält.","bibelstelle":"1 Kor 13,1","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.13.1-1CO.13.1"}],"zitate":[{"text":"„Ihr seid der Leib Christi, und jeder einzelne ist ein Glied davon.“","quelle":"1 Kor 12,27","link":"https://www.die-bibel.de/bibel/BB/1CO.12.27-1CO.12.27"},{"text":"„Wenn ein Glied leidet, leiden alle anderen Glieder mit.“","quelle":"1 Kor 12,26","link":"https://www.die-bibel.de/bibel/BB/1CO.12.26-1CO.12.26"},{"text":"„Die Liebe ist geduldig und gütig.“","quelle":"1 Kor 13,4","link":"https://www.die-bibel.de/bibel/BB/1CO.13.4-1CO.13.4"}]},{"id":"bibel","titel":"Bibel","icon":"📖","farbe":"#27ae60","fragen":[{"id":"bi1","typ":"multiple-choice","schwierigkeit":1,"frage":"Was bedeutet das Wort »Bibel«?","antworten":["Das heilige Buch","Die Bücher","Gottes Wort","Die Wahrheit"],"richtig":1,"erklaerung":"»Bibel« kommt vom griechischen »biblia« — das bedeutet einfach: die Bücher. Die Bibel ist eine Sammlung von 66 (ev.) bzw. 73 (kath.) Einzelschriften.","bibelstelle":null,"bibellink":null},{"id":"bi2","typ":"multiple-choice","schwierigkeit":1,"frage":"In welche zwei großen Teile ist die Bibel aufgeteilt?","antworten":["Gesetze und Geschichten","Altes und Neues Testament","Propheten und Briefe","Evangelien und Psalmen"],"richtig":1,"erklaerung":"Das Alte Testament erzählt von Gott und Israel vor Christus. Das Neue Testament beginnt mit Jesus — seiner Geburt, seinem Wirken, seinem Tod und seiner Auferstehung.","bibelstelle":null,"bibellink":null},{"id":"bi3","typ":"luecke","schwierigkeit":1,"frage":"Das erste Buch der Bibel heißt »___« und erzählt von der Erschaffung der Welt.","antworten":["Exodus","Genesis","Psalmen","Offenbarung"],"richtig":1,"erklaerung":"Genesis bedeutet »Entstehung« oder »Anfang«. Es beginnt mit den berühmten Worten: »Am Anfang schuf Gott Himmel und Erde.«","bibelstelle":"Gen 1,1","bibellink":"https://www.die-bibel.de/bibel/BB/GEN.1.1-GEN.1.1"},{"id":"bi4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wie heißen die vier Evangelien im Neuen Testament?","antworten":["Paulus, Petrus, Jakobus, Johannes","Matthäus, Markus, Lukas, Johannes","Jesaja, Jeremia, Ezechiel, Daniel","Genesis, Exodus, Levitikus, Numeri"],"richtig":1,"erklaerung":"Die vier Evangelien erzählen das Leben und Wirken Jesu — aus vier verschiedenen Perspektiven. »Evangelium« bedeutet: gute Nachricht.","bibelstelle":null,"bibellink":null},{"id":"bi5","typ":"multiple-choice","schwierigkeit":2,"frage":"In welcher Sprache wurde das Neue Testament ursprünglich geschrieben?","antworten":["Latein","Hebräisch","Aramäisch","Griechisch"],"richtig":3,"erklaerung":"Das NT wurde auf Griechisch verfasst — der damaligen Weltsprache. Das Alte Testament wurde hauptsächlich auf Hebräisch geschrieben.","bibelstelle":null,"bibellink":null},{"id":"bi6","typ":"luecke","schwierigkeit":3,"frage":"»Dein Wort ist meines Fußes ___ und ein Licht auf meinem Weg.« (Ps 119,105)","antworten":["Stärke","Leuchte","Führung","Wahrheit"],"richtig":1,"erklaerung":"Psalm 119 ist der längste Psalm — und handelt ganz von der Bedeutung von Gottes Wort für das Leben. Vers 105 ist einer der bekanntesten Bibelverse überhaupt.","bibelstelle":"Ps 119,105","bibellink":"https://www.die-bibel.de/bibel/BB/PSA.119.105-PSA.119.105"},{"id":"bi7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was versteht man unter dem »Kanon« der Bibel?","antworten":["Die Melodie der Psalmen","Die festgelegte Sammlung der anerkannten Bücher","Den ältesten Teil des AT","Die lateinische Übersetzung"],"richtig":1,"erklaerung":"»Kanon« (griech. »Maßstab«) bezeichnet die Bücher, die die Kirche als heilige Schrift anerkannt hat. Über manche Bücher wurde jahrhundertelang diskutiert.","bibelstelle":null,"bibellink":null}],"zitate":[{"text":"„Dein Wort ist meines Fußes Leuchte und ein Licht auf meinem Weg.“","quelle":"Ps 119,105","link":"https://www.die-bibel.de/bibel/BB/PSA.119.105-PSA.119.105"},{"text":"„Am Anfang schuf Gott Himmel und Erde.“","quelle":"Gen 1,1","link":"https://www.die-bibel.de/bibel/BB/GEN.1.1-GEN.1.1"},{"text":"„Das Wort Gottes ist lebendig und wirksam.“","quelle":"Hebr 4,12","link":"https://www.die-bibel.de/bibel/BB/HEB.4.12-HEB.4.12"}]}]};</script>

</body>
</html>
