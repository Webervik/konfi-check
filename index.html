<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konfi-Check ✓</title>
  <meta name="description" content="Quiz-App für Konfirmanden der Gemeinden Staaken" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<!-- ===== STARTSCREEN ===== -->
<div id="screen-start" class="screen active">
  <div class="app-header">
    <div class="app-title">Konfi<span>-Check</span> ✓</div>
    <div class="app-subtitle">Was weißt du über Glauben & Gemeinde?</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="input-name">Dein Name</label>
      <input type="text" id="input-name" placeholder="Wie heißt du?" autocomplete="off" maxlength="30" />
    </div>

    <div class="form-group">
      <label>Deine Gruppe</label>
      <div class="gruppe-grid" id="gruppe-grid">
        <button class="gruppe-btn" data-gruppe="Konfis Dorfkirche">
          ⛪ Konfis<br>Dorfkirche
        </button>
        <button class="gruppe-btn" data-gruppe="Konfis Gartenstadt">
          🌳 Konfis<br>Gartenstadt
        </button>
        <button class="gruppe-btn" data-gruppe="Eltern">
          👨‍👩‍👧 Eltern
        </button>
        <button class="gruppe-btn" data-gruppe="Gemeinde">
          🕊️ Gemeinde
        </button>
        <button class="gruppe-btn" data-gruppe="Sonstige">
          🌍 Sonstige
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Thema wählen</label>
      <div class="themen-grid" id="themen-grid">
        <!-- wird per JS befüllt -->
      </div>
    </div>

    <button class="btn btn-primary" id="btn-start">
      Los geht's! 🚀
    </button>

    <button class="btn" id="btn-scores"
      style="margin-top:12px; width:100%; background:rgba(0,0,0,0.06); color:#555;">
      🏆 Scoreboard ansehen
    </button>
  </div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="screen-quiz" class="screen">
  <div style="width:100%; max-width:600px;">
    <div class="quiz-meta" id="quiz-meta"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="quiz-card" id="quiz-card">
    <!-- wird per JS befüllt -->
  </div>
</div>

<!-- ===== ERGEBNIS SCREEN ===== -->
<div id="screen-ergebnis" class="screen">
  <div class="app-header">
    <div class="app-title">Ergebnis</div>
  </div>
  <div class="card" style="text-align:center; max-width:420px;">
    <div class="ergebnis-emoji" id="ergebnis-emoji">🎉</div>
    <div class="ergebnis-score" id="ergebnis-score">0/7</div>
    <div class="ergebnis-text" id="ergebnis-text"></div>
    <div class="ergebnis-actions">
      <button class="btn btn-primary" id="btn-scores-from-result">🏆 Scoreboard ansehen</button>
      <button class="btn btn-secondary" id="btn-nochmal">🔁 Nochmal versuchen</button>
      <button class="btn" id="btn-zum-start"
        style="background:rgba(0,0,0,0.06); color:#555;">
        🏠 Zurück zum Start
      </button>
    </div>
  </div>
</div>

<!-- ===== SCORES SCREEN ===== -->
<div id="screen-scores" class="screen">

  <!-- Team-Rangliste -->
  <div id="team-rangliste" style="width:100%; max-width:600px; margin-bottom:16px;"></div>

  <!-- Tabs -->
  <div class="gruppe-tabs" style="flex-wrap:wrap;">
    <button class="gruppe-tab active" data-filter="alle">Alle</button>
    <button class="gruppe-tab" data-filter="Konfis Dorfkirche">⛪ Dorfkirche</button>
    <button class="gruppe-tab" data-filter="Konfis Gartenstadt">🌳 Gartenstadt</button>
    <button class="gruppe-tab" data-filter="Eltern">👨‍👩‍👧 Eltern</button>
    <button class="gruppe-tab" data-filter="Gemeinde">🕊️ Gemeinde</button>
    <button class="gruppe-tab" data-filter="Sonstige">🌍 Sonstige</button>
  </div>

  <!-- Liste -->
  <div class="score-list" id="score-list">
    <div class="loading"><div class="spinner"></div>Lade…</div>
  </div>

  <button class="btn" id="btn-back-scores"
    style="margin-top:20px; background:rgba(255,255,255,0.15); color:#fff; width:100%; max-width:600px;">
    ← Zurück
  </button>

  <button id="btn-eintraege-entfernen"
    style="margin-top:8px; width:100%; max-width:600px; background:#0f3460; border:none; color:#0f3460; cursor:pointer; padding:10px; border-radius:8px;">
    eintraege entfernen
  </button>

</div>

<!-- Konfetti-Container -->
<div class="konfetti" id="konfetti"></div>

<script>window.FRAGEN_DATA = {"themen":[{"id":"pfingsten","titel":"Pfingsten","icon":"🕊️","farbe":"#e67e22","fragen":[{"id":"pf1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wann feiern Christen Pfingsten?","antworten":["25 Tage nach Ostern","50 Tage nach Ostern","40 Tage nach Ostern","7 Wochen nach Weihnachten"],"richtig":1,"erklaerung":"Der Name kommt vom griechischen »Pentekoste« — der 50. Tag nach Ostern. Das griechische Wort erinnert daran, dass Pfingsten ursprünglich ein jüdisches Fest war — die Christen gaben ihm eine neue Bedeutung.","bibelstelle":null,"bibellink":null},{"id":"pf2","typ":"multiple-choice","schwierigkeit":1,"frage":"Was passierte laut Bibel an Pfingsten?","antworten":["Jesus erschien den Jüngern","Der Heilige Geist kam auf die Jünger herab","Jesus fuhr in den Himmel auf","Die Jünger fasteten 40 Tage"],"richtig":1,"erklaerung":"Wind, Feuer, Zungenreden — der Heilige Geist kam auf die versammelten Jünger. Lukas beschreibt es als Sturm, Feuer und das Sprechen in fremden Sprachen. Das Erstaunen der Umstehenden war riesig — sie fragten: Was soll das bedeuten?","bibelstelle":"Apg 2,1-4","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.1-ACT.2.4"},{"id":"pf3","typ":"luecke","schwierigkeit":2,"frage":"Ergänze: Pfingsten wird der »___ der Kirche« genannt.","antworten":["Todestag","Geburtstag","Jahrestag","Namenstag"],"richtig":1,"erklaerung":"An diesem Tag entstand die erste Gemeinde — Menschen hörten die Botschaft und schlossen sich zusammen. Wenn Pfingsten der Geburtstag der Kirche ist, dann nicht der Kirche als Institution — sondern als lebendige Gemeinschaft von Menschen, die gemeinsam glauben und handeln.","bibelstelle":"Apg 2,41","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.41-ACT.2.41"},{"id":"pf4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wie viele Menschen ließen sich laut Bibel an Pfingsten taufen?","antworten":["120","500","3000","12"],"richtig":2,"erklaerung":"Apg 2,41: »An diesem Tag kamen etwa dreitausend Menschen hinzu.« 3000 Menschen an einem einzigen Tag — das zeigt die Sprengkraft der Pfingstbotschaft. Heute sind es weltweit über 2 Milliarden Christen.","bibelstelle":"Apg 2,41","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.41-ACT.2.41"},{"id":"pf5","typ":"bild","schwierigkeit":2,"frage":"Was stellt diese Taube in der christlichen Kunst dar?","bild":"assets/pfingsten.jpg","bildalt":"Fresko aus der Wiener Karlskirche (18. Jh.) — Taube als Symbol des Heiligen Geistes mit Lichtstrahlen","antworten":["Den Frieden nach der Sintflut","Den Heiligen Geist","Die Seele Marias","Einen Engel Gottes"],"richtig":1,"erklaerung":"Die Taube ist das klassische Symbol des Heiligen Geistes — schon bei Jesu Taufe erschien er so. Dieses Fresko aus der Wiener Karlskirche (18. Jh.) zeigt ihn mit goldenen Lichtstrahlen. In der Kunst erscheint der Heilige Geist fast immer als Taube oder als Feuer — beides sind Bilder für etwas, das man sieht und spürt, aber nicht festhalten kann.","bibelstelle":"Mt 3,16","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.3.16-MAT.3.16"},{"id":"pf6","typ":"multiple-choice","schwierigkeit":3,"frage":"Welches jüdische Fest fiel auf denselben Tag wie das biblische Pfingsten?","antworten":["Pessach","Schawuot (Wochenfest)","Jom Kippur","Sukkot"],"richtig":1,"erklaerung":"Schawuot erinnert an die Gabe der Tora am Sinai — Lukas setzt bewusst Pfingsten an diesen Tag: Gottes Geist ersetzt das Gesetz. Für Lukas ist das kein Zufall: Wie Gott am Sinai die Tora gab, so gibt er jetzt seinen Geist. Das Alte wird nicht abgeschafft — es wird erfüllt.","bibelstelle":"Apg 2,1","bibellink":"https://www.die-bibel.de/bibel/BB/ACT.2.1-ACT.2.1"},{"id":"pf7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was bedeutet theologisch »Heiliger Geist« in der Dreieinigkeit?","antworten":["Ein Engel Gottes","Die dritte Person der Trinität","Das Gewissen des Menschen","Die Bibel selbst"],"richtig":1,"erklaerung":"Vater, Sohn, Heiliger Geist — drei Personen, ein Gott. Das Trinitätsdogma wurde im 4. Jh. formuliert. Die Dreieinigkeit ist kein mathematisches Rätsel, sondern eine Aussage über Gottes Wesen: Gott ist Beziehung. Vater, Sohn und Geist stehen in ewiger Gemeinschaft.","bibelstelle":"Mt 28,19","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.28.19-MAT.28.19"}],"zitate":[{"text":"Der Geist weht, wo er will.","quelle":"Joh 3,8","link":"https://www.die-bibel.de/bibel/BB/JHN.3.8-JHN.3.8"},{"text":"Wo der Geist des Herrn ist, da ist Freiheit.","quelle":"2 Kor 3,17","link":"https://www.die-bibel.de/bibel/BB/2CO.3.17-2CO.3.17"},{"text":"Die Frucht des Geistes ist Liebe, Freude, Friede.","quelle":"Gal 5,22","link":"https://www.die-bibel.de/bibel/BB/GAL.5.22-GAL.5.22"},{"text":"Der Geist hilft unserer Schwachheit auf.","quelle":"Röm 8,26","link":"https://www.die-bibel.de/bibel/BB/ROM.8.26-ROM.8.26"},{"text":"Nicht durch Heer und Kraft, sondern durch meinen Geist.","quelle":"Sach 4,6","link":"https://www.die-bibel.de/bibel/BB/ZEC.4.6-ZEC.4.6"}]},{"id":"gemeinde","titel":"Gemeinde","icon":"🫀","farbe":"#8e44ad","fragen":[{"id":"gm1","typ":"multiple-choice","schwierigkeit":1,"frage":"Mit welchem Bild beschreibt Paulus die Gemeinde?","antworten":["Als ein Schiff auf hoher See","Als einen Leib mit vielen Gliedern","Als einen Baum mit vielen Ästen","Als eine Herde mit einem Hirten"],"richtig":1,"erklaerung":"Paulus vergleicht die Gemeinde mit einem menschlichen Körper — viele Teile, aber ein Ganzes. Das Bild des Leibes war für die antike Welt nicht neu — aber Paulus füllt es neu: Dieser Leib hat ein Haupt, und das ist Christus. Das verändert alles.","bibelstelle":"1 Kor 12,12","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.12-1CO.12.12"},{"id":"gm2","typ":"luecke","schwierigkeit":1,"frage":"»Ihr seid der ___ Christi und jeder einzelne ein Glied davon.« (1 Kor 12,27)","antworten":["Geist","Leib","Name","Weg"],"richtig":1,"erklaerung":"Paulus sagt klar: Die Gemeinde IST der Leib Christi — nicht nur ein Bild, sondern eine Wirklichkeit. Paulus sagt nicht: Ihr sollt wie ein Leib sein. Er sagt: Ihr SEID es. Die Herausforderung ist, danach zu leben — auch wenn es schwer fällt.","bibelstelle":"1 Kor 12,27","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.27-1CO.12.27"},{"id":"gm3","typ":"multiple-choice","schwierigkeit":2,"frage":"Wer ist laut Paulus das »Haupt« des Leibes — also der Gemeinde?","antworten":["Der Bischof","Der Pfarrer","Christus","Der Kirchenvorstand"],"richtig":2,"erklaerung":"Nicht eine Amtsperson, sondern Christus selbst ist das Haupt. Alle anderen dienen — sie leiten nicht aus eigener Macht. Das bedeutet: Kein Mensch in der Gemeinde kann sagen, er sei der Boss. Alle — Pfarrerin, Kirchenvorstand, Konfirmanden — dienen unter demselben Haupt.","bibelstelle":"Eph 4,15","bibellink":"https://www.die-bibel.de/bibel/BB/EPH.4.15-EPH.4.15"},{"id":"gm4","typ":"multiple-choice","schwierigkeit":2,"frage":"Was passiert laut Paulus, wenn ein Glied des Leibes leidet?","antworten":["Es wird abgetrennt","Alle anderen leiden mit","Das Haupt entscheidet allein","Das Glied muss sich selbst helfen"],"richtig":1,"erklaerung":"Gemeinde bedeutet Solidarität — kein »das ist dein Problem«. Schmerz eines Gliedes betrifft den ganzen Leib. Das ist eine hohe Anforderung und ein Versprechen zugleich: Du bist nie allein mit deinem Schmerz. Gemeinde bedeutet, füreinander da zu sein — im Guten wie im Schweren.","bibelstelle":"1 Kor 12,26","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.26-1CO.12.26"},{"id":"gm5","typ":"bild","schwierigkeit":2,"frage":"Was sagt Paulus über Glieder, die uns »schwächer« erscheinen?","bild":"assets/leib.jpg","bildalt":"Betende Hände (Albrecht Dürer, 1508) — Symbol für Gemeinschaft und Füreinander-Eintreten","antworten":["Sie können ausgetauscht werden","Sie sind unentbehrlich","Sie stören den Leib","Sie müssen stärker werden"],"richtig":1,"erklaerung":"Paulus dreht die Logik um: Gerade die scheinbar schwachen Glieder sind nötig. Kein Mensch ist in der Gemeinde überflüssig. Luther sagte: Das scheinbar Schwache ist oft das Tragendste. Eine Gemeinde, die nur auf die Starken setzt, verliert ihr Herz.","bibelstelle":"1 Kor 12,22","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.22-1CO.12.22"},{"id":"gm6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was nennt Paulus »Charismen«?","antworten":["Kirchliche Ämter","Persönliche Talente zum Selbstverwirklichen","Gaben des Geistes für den Dienst an anderen","Besondere Verdienste um die Kirche"],"richtig":2,"erklaerung":"Charismen sind nicht Privatbesitz — sie kommen vom Geist und sind für die Gemeinschaft bestimmt. Jedes Glied hat eine Gabe. Die Frage ist nicht: Was kann ich gut? Sondern: Wozu hat Gott mich begabt — für andere? Charismen sind immer für die Gemeinschaft bestimmt, nie nur für einen selbst.","bibelstelle":"1 Kor 12,4-7","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.12.4-1CO.12.7"},{"id":"gm7","typ":"multiple-choice","schwierigkeit":3,"frage":"Welchen »noch besseren Weg« zeigt Paulus direkt nach dem Bild vom Leib?","antworten":["Das Gebet","Die Liebe","Den Gottesdienst","Die Bibellektüre"],"richtig":1,"erklaerung":"1 Kor 13 folgt direkt: Alle Charismen ohne Liebe sind nichts. Die Liebe ist das Band, das den Leib zusammenhält. Paulus schreibt: Auch wenn ich Berge versetzen könnte, ohne Liebe bin ich nichts. Das ist eine radikale Aussage — und eine Einladung.","bibelstelle":"1 Kor 13,1","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.13.1-1CO.13.1"}],"zitate":[{"text":"„Einer trage des anderen Last.“","quelle":"Gal 6,2","link":"https://www.die-bibel.de/bibel/BB/GAL.6.2-GAL.6.2"},{"text":"„Die Liebe ist geduldig und gütig.“","quelle":"1 Kor 13,4","link":"https://www.die-bibel.de/bibel/BB/1CO.13.4-1CO.13.4"},{"text":"„Seid freundlich zueinander und vergebt einander.“","quelle":"Eph 4,32","link":"https://www.die-bibel.de/bibel/BB/EPH.4.32-EPH.4.32"},{"text":"„Ihr seid Gottes Tempel.“","quelle":"1 Kor 3,16","link":"https://www.die-bibel.de/bibel/BB/1CO.3.16-1CO.3.16"},{"text":"„Wo zwei oder drei in meinem Namen versammelt sind, bin ich mitten unter ihnen.“","quelle":"Mt 18,20","link":"https://www.die-bibel.de/bibel/BB/MAT.18.20-MAT.18.20"}]},{"id":"bibel","titel":"Bibel","icon":"📖","farbe":"#27ae60","fragen":[{"id":"bi1","typ":"multiple-choice","schwierigkeit":1,"frage":"Was bedeutet das Wort »Bibel«?","antworten":["Das heilige Buch","Die Bücher","Gottes Wort","Die Wahrheit"],"richtig":1,"erklaerung":"»Bibel« kommt vom griechischen »biblia« — das bedeutet einfach: die Bücher. Die Bibel ist eine Sammlung von 66 (ev.) bzw. 73 (kath.) Einzelschriften. Diese Vielfalt zeigt sich im Inhalt: Liebesgedichte, Gesetzestexte, Briefe, Prophezeiungen, Geschichten. Die Bibel ist eine Bibliothek, kein einheitliches Buch.","bibelstelle":null,"bibellink":null},{"id":"bi2","typ":"multiple-choice","schwierigkeit":1,"frage":"In welche zwei großen Teile ist die Bibel aufgeteilt?","antworten":["Gesetze und Geschichten","Altes und Neues Testament","Propheten und Briefe","Evangelien und Psalmen"],"richtig":1,"erklaerung":"Das Alte Testament erzählt von Gott und Israel vor Christus. Das Neue Testament beginnt mit Jesus — seiner Geburt, seinem Wirken, seinem Tod und seiner Auferstehung. Das AT umfasst etwa 39 Bücher (ev.) und ist auf Hebräisch/Aramäisch geschrieben. Das NT hat 27 Bücher auf Griechisch. Beide gehören untrennbar zusammen.","bibelstelle":null,"bibellink":null},{"id":"bi3","typ":"luecke","schwierigkeit":1,"frage":"Das erste Buch der Bibel heißt »___« und erzählt von der Erschaffung der Welt.","antworten":["Exodus","Genesis","Psalmen","Offenbarung"],"richtig":1,"erklaerung":"Genesis bedeutet »Entstehung« oder »Anfang«. Es beginnt mit den berühmten Worten: »Am Anfang schuf Gott Himmel und Erde.« Die Genesis beginnt nicht mit einem wissenschaftlichen Bericht, sondern mit einem Bekenntnis: Alles, was ist, kommt von Gott. Das ist die Grundaussage.","bibelstelle":"Gen 1,1","bibellink":"https://www.die-bibel.de/bibel/BB/GEN.1.1-GEN.1.1"},{"id":"bi4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wie heißen die vier Evangelien im Neuen Testament?","antworten":["Paulus, Petrus, Jakobus, Johannes","Matthäus, Markus, Lukas, Johannes","Jesaja, Jeremia, Ezechiel, Daniel","Genesis, Exodus, Levitikus, Numeri"],"richtig":1,"erklaerung":"Die vier Evangelien erzählen das Leben und Wirken Jesu — aus vier verschiedenen Perspektiven. »Evangelium« bedeutet: gute Nachricht. Matthäus schreibt für Juden, Markus knapp und dramatisch, Lukas für Nichtjuden, Johannes theologisch. Vier Perspektiven auf dieselbe Person — das ist Reichtum, kein Widerspruch.","bibelstelle":null,"bibellink":null},{"id":"bi5","typ":"multiple-choice","schwierigkeit":2,"frage":"In welcher Sprache wurde das Neue Testament ursprünglich geschrieben?","antworten":["Latein","Hebräisch","Aramäisch","Griechisch"],"richtig":3,"erklaerung":"Das NT wurde auf Griechisch verfasst — der damaligen Weltsprache. Das Alte Testament wurde hauptsächlich auf Hebräisch geschrieben. Griechisch war die Weltsprache der damaligen Zeit — wie heute Englisch. Paulus und die anderen wählten sie bewusst: Die Botschaft sollte alle erreichen.","bibelstelle":null,"bibellink":null},{"id":"bi6","typ":"luecke","schwierigkeit":3,"frage":"»Dein Wort ist meines Fußes ___ und ein Licht auf meinem Weg.« (Ps 119,105)","antworten":["Stärke","Leuchte","Führung","Wahrheit"],"richtig":1,"erklaerung":"Psalm 119 ist der längste Psalm — und handelt ganz von der Bedeutung von Gottes Wort für das Leben. Vers 105 ist einer der bekanntesten Bibelverse überhaupt. Dieser Vers ist ein Lieblingsvers vieler Christen. Er sagt: Das Wort Gottes erhellt nicht den ganzen Weg auf einmal — nur den nächsten Schritt. Das reicht.","bibelstelle":"Ps 119,105","bibellink":"https://www.die-bibel.de/bibel/BB/PSA.119.105-PSA.119.105"},{"id":"bi7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was versteht man unter dem »Kanon« der Bibel?","antworten":["Die Melodie der Psalmen","Die festgelegte Sammlung der anerkannten Bücher","Den ältesten Teil des AT","Die lateinische Übersetzung"],"richtig":1,"erklaerung":"»Kanon« (griech. »Maßstab«) bezeichnet die Bücher, die die Kirche als heilige Schrift anerkannt hat. Über manche Bücher wurde jahrhundertelang diskutiert. Evangelische und katholische Kirche haben unterschiedliche Kanons — Katholiken haben 7 Bücher mehr (die sog. Deuterokanonischen). Die Frage, welche Bücher dazugehören, war jahrhundertelang umstritten.","bibelstelle":null,"bibellink":null}],"zitate":[{"text":"Das Wort des Herrn bleibt in Ewigkeit.","quelle":"1 Petr 1,25","link":"https://www.die-bibel.de/bibel/BB/1PE.1.25-1PE.1.25"},{"text":"Alle Schrift ist von Gott eingegeben.","quelle":"2 Tim 3,16","link":"https://www.die-bibel.de/bibel/BB/2TIM.3.16-2TIM.3.16"},{"text":"Das Wort Gottes ist lebendig und wirksam.","quelle":"Hebr 4,12","link":"https://www.die-bibel.de/bibel/BB/HEB.4.12-HEB.4.12"},{"text":"Dein Wort ist eine Leuchte für meinen Fuß.","quelle":"Ps 119,105","link":"https://www.die-bibel.de/bibel/BB/PSA.119.105-PSA.119.105"},{"text":"Der Mensch lebt nicht vom Brot allein, sondern von jedem Wort Gottes.","quelle":"Lk 4,4","link":"https://www.die-bibel.de/bibel/BB/LUK.4.4-LUK.4.4"}]},{"id":"jesus-historisch","titel":"Jesus von Nazareth","icon":"🏛️","farbe":"#2980b9","zitate":[{"text":"„Das Wort wurde Fleisch und wohnte unter uns.“","quelle":"Joh 1,14","link":"https://www.die-bibel.de/bibel/BB/JHN.1.14-JHN.1.14"},{"text":"„Jesus zog umher und tat Gutes.“","quelle":"Apg 10,38","link":"https://www.die-bibel.de/bibel/BB/ACT.10.38-ACT.10.38"},{"text":"„Ich bin nicht gekommen, Gerechte zu rufen, sondern Sünder.“","quelle":"Mk 2,17","link":"https://www.die-bibel.de/bibel/BB/MRK.2.17-MRK.2.17"},{"text":"„Kann aus Nazareth etwas Gutes kommen?“","quelle":"Joh 1,46","link":"https://www.die-bibel.de/bibel/BB/JHN.1.46-JHN.1.46"},{"text":"„Ich muss in dem sein, was meines Vaters ist.“","quelle":"Lk 2,49","link":"https://www.die-bibel.de/bibel/BB/LUK.2.49-LUK.2.49"}],"fragen":[{"id":"jh1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wo wurde Jesus geboren?","antworten":["Jerusalem","Nazareth","Bethlehem","Kafarnaum"],"richtig":2,"erklaerung":"Jesus wurde laut den Evangelien in Bethlehem geboren. Aufgewachsen ist er in Nazareth, weshalb er Jesus von Nazareth genannt wird. Nazareth war ein kleines Dorf ohne besondere Bedeutung. Niemand hätte erwartet, dass von dort die Welt verändert würde — das passt zu Jesu ganzer Geschichte.","bibelstelle":"Lk 2,4-7","bibellink":"https://www.die-bibel.de/bibel/BB/LUK.2.4-LUK.2.7"},{"id":"jh2","typ":"multiple-choice","schwierigkeit":1,"frage":"Was war der Beruf von Jesu Pflegevater Josef?","antworten":["Fischer","Zimmermann","Schriftgelehrter","Händler"],"richtig":1,"erklaerung":"Josef war Zimmermann. Jesus wuchs in einfachen Verhältnissen auf, nicht in der Elite seiner Zeit. Ein Handwerker, kein Priester, kein Gelehrter. Jesus kannte das harte Leben der einfachen Leute aus eigener Erfahrung. Das prägte seine Botschaft.","bibelstelle":"Mt 13,55","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.13.55-MAT.13.55"},{"id":"jh3","typ":"multiple-choice","schwierigkeit":1,"frage":"Wer taufte Jesus im Jordan?","antworten":["Petrus","Herodes","Johannes der Täufer","Der Hohepriester"],"richtig":2,"erklaerung":"Johannes der Täufer taufte Jesus im Jordan — das war der Beginn von Jesu öffentlichem Wirken. Die Taufe markiert Jesu Aufbruch in seinen öffentlichen Dienst. Danach zog er 40 Tage in die Wüste — dann begann sein Wirken in Galiläa.","bibelstelle":"Mk 1,9","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.1.9-MRK.1.9"},{"id":"jh4","typ":"luecke","schwierigkeit":2,"frage":"Jesus wirkte vor allem in der Region ___ am See Gennesaret.","antworten":["Judäa","Samaria","Galiläa","Peräa"],"richtig":2,"erklaerung":"Der Großteil von Jesu Wirken fand in Galiläa statt. Erst gegen Ende zog er nach Jerusalem. Kafarnaum am See Gennesaret wurde so etwas wie Jesu Heimatbasis. Dort rief er seine ersten Jünger, heilte und lehrte in der Synagoge.","bibelstelle":"Mk 1,14","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.1.14-MRK.1.14"},{"id":"jh5","typ":"multiple-choice","schwierigkeit":2,"frage":"Unter welchem römischen Statthalter wurde Jesus hingerichtet?","antworten":["Herodes","Pontius Pilatus","Augustus","Tiberius"],"richtig":1,"erklaerung":"Pontius Pilatus war der römische Statthalter in Judäa und unterzeichnete das Todesurteil. Er ist auch in nichtchristlichen Quellen belegt. Das Todesurteil war formal römisch, aber die Initiative kam von den Jerusalemer Tempelautoritäten. Die genauen Hintergründe sind historisch komplex.","bibelstelle":"Mt 27,24","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.27.24-MAT.27.24"},{"id":"jh6","typ":"multiple-choice","schwierigkeit":3,"frage":"Welcher nichtchristliche Historiker erwähnt Jesus als historische Person?","antworten":["Platon","Tacitus","Aristoteles","Herodot"],"richtig":1,"erklaerung":"Der römische Historiker Tacitus erwähnt um 116 n.Chr. die Hinrichtung Jesu unter Pilatus. Auch Flavius Josephus, ein jüdischer Historiker, nennt ihn. Tacitus schreibt in seinen Annalen: Christus wurde unter Tiberius durch den Prokurator Pontius Pilatus hingerichtet. Das ist eine der ältesten nichtchristlichen Erwähnungen Jesu.","bibelstelle":null,"bibellink":null},{"id":"jh7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meinen Historiker mit der Jesusüberlieferung?","antworten":["Nur die vier Evangelien","Die Gesamtheit aller Quellen über das Leben Jesu","Jesu eigene Schriften","Die Briefe des Paulus"],"richtig":1,"erklaerung":"Jesus selbst schrieb nichts auf. Alles was wir wissen, stammt aus Überlieferungen. Historiker prüfen diese kritisch. Historiker unterscheiden zwischen dem historischen Jesus und dem Christus des Glaubens. Beides ist wichtig — und beides gehört zusammen, wenn man Jesus verstehen will.","bibelstelle":null,"bibellink":null}]},{"id":"jesus-christus","titel":"Jesus, der Christus","icon":"✝️","farbe":"#c0392b","zitate":[{"text":"Gott hat die Welt so sehr geliebt, dass er seinen einzigen Sohn gab.","quelle":"Joh 3,16","link":"https://www.die-bibel.de/bibel/BB/JHN.3.16-JHN.3.16"},{"text":"Jesus Christus ist derselbe gestern, heute und in Ewigkeit.","quelle":"Hebr 13,8","link":"https://www.die-bibel.de/bibel/BB/HEB.13.8-HEB.13.8"},{"text":"Ich bin das Licht der Welt.","quelle":"Joh 8,12","link":"https://www.die-bibel.de/bibel/BB/JHN.8.12-JHN.8.12"},{"text":"Er ist nicht hier — er ist auferstanden.","quelle":"Mt 28,6","link":"https://www.die-bibel.de/bibel/BB/MAT.28.6-MAT.28.6"},{"text":"Wer mich sieht, der sieht den Vater.","quelle":"Joh 14,9","link":"https://www.die-bibel.de/bibel/BB/JHN.14.9-JHN.14.9"}],"fragen":[{"id":"jc1","typ":"luecke","schwierigkeit":1,"frage":"Christus ist kein Nachname, sondern ein Titel. Er bedeutet: der ___.","antworten":["Gerechte","Gesalbte","Auferstandene","Sohn Gottes"],"richtig":1,"erklaerung":"Christus ist die griechische Übersetzung von Messias — beides bedeutet: der Gesalbte. Im AT wurden Könige und Priester gesalbt. Im AT wurden Könige wie David und Saul gesalbt — als Zeichen, dass Gott sie berufen hat. Jesus als der Gesalbte bedeutet: Er ist der von Gott gesandte König und Retter.","bibelstelle":null,"bibellink":null},{"id":"jc2","typ":"multiple-choice","schwierigkeit":1,"frage":"Was feiern Christen an Ostern?","antworten":["Jesu Geburt","Die Auferstehung Jesu von den Toten","Die Himmelfahrt","Das letzte Abendmahl"],"richtig":1,"erklaerung":"Ostern ist das Herzstück des christlichen Glaubens: Gott hat Jesus vom Tod auferweckt. Das ist das Kerygma — die Kernbotschaft. Paulus schreibt: Wenn Christus nicht auferstanden ist, ist euer Glaube nichtig. Die Auferstehung ist kein Anhang zum Glauben — sie ist sein Fundament.","bibelstelle":"1 Kor 15,3-4","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.15.3-1CO.15.4"},{"id":"jc3","typ":"multiple-choice","schwierigkeit":2,"frage":"Was ist das Apostolische Glaubensbekenntnis?","antworten":["Eine Liste der 12 Apostel","Ein Bekenntnis zu Gott, Jesus und dem Heiligen Geist","Ein Brief des Paulus","Die Bergpredigt in Kurzform"],"richtig":1,"erklaerung":"Das Apostolische Glaubensbekenntnis fasst zusammen, woran Christen glauben — in drei Teilen: Gott Vater, Jesus Christus, Heiliger Geist. Das Bekenntnis beginnt mit Vertrauen, nicht mit Wissen: Ich glaube. Es ist keine Prüfung zum Auswendiglernen, sondern ein Beziehungsausdruck.","bibelstelle":null,"bibellink":null},{"id":"jc4","typ":"multiple-choice","schwierigkeit":2,"frage":"Was meint Inkarnation?","antworten":["Die Auferstehung Jesu","Das Wort Gottes wird Mensch in Jesus","Die Taufe Jesu","Die Himmelfahrt"],"richtig":1,"erklaerung":"Inkarnation bedeutet Menschwerdung (lat. caro = Fleisch). Gott wird in Jesus Mensch — eine der kühnsten Aussagen des christlichen Glaubens. Gott als Mensch — das ist ein Skandal für viele. Für Christen ist genau das die gute Nachricht: Gott hat sich nicht distanziert, sondern ist mitten hineingesprungen ins Leben.","bibelstelle":"Joh 1,14","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.1.14-JHN.1.14"},{"id":"jc5","typ":"multiple-choice","schwierigkeit":2,"frage":"Was verkündigt Paulus als Kern des Evangeliums?","antworten":["Die Bergpredigt","Jesu Tod für unsere Sünden und seine Auferstehung","Das Vaterunser","Die Zehn Gebote"],"richtig":1,"erklaerung":"Paulus nennt es selbst: Christus ist für unsere Sünden gestorben und auferweckt worden. Das Kerygma — die urchristliche Kernbotschaft. Diese Botschaft ist nicht einfach eine Lehrmeinung — sie ist eine Einladung. Paulus hat sie selbst erlebt: Er war Christenverfolger, dann Apostel. Die Auferstehung veränderte alles.","bibelstelle":"1 Kor 15,3-4","bibellink":"https://www.die-bibel.de/bibel/BB/1CO.15.3-1CO.15.4"},{"id":"jc6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was bedeutet Soteriologie?","antworten":["Die Lehre von der Schöpfung","Die Lehre vom Heil durch Christus","Die Lehre von der Kirche","Die Lehre von den letzten Dingen"],"richtig":1,"erklaerung":"Soteriologie (griech. soteria = Heil) fragt: Wie rettet Gott durch Christus? Bilder: Versöhnung, Freikauf, Sieg über den Tod. Verschiedene Bilder wurden im Laufe der Geschichte entwickelt: Sühnopfer, Versöhnung, Befreiung, Sieg über den Tod. Keines ist vollständig — zusammen ergeben sie ein reiches Bild.","bibelstelle":null,"bibellink":null},{"id":"jc7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint der Begriff Kerygma?","antworten":["Ein griechisches Gebet","Die Verkündigung von Tod und Auferstehung Jesu","Ein frühchristlicher Lobgesang","Die Taufformel"],"richtig":1,"erklaerung":"Kerygma (griech. = Verkündigung): Jesus ist gestorben und auferstanden. Nicht nur Bericht — sondern Anruf zur Entscheidung. Das Kerygma ist älter als die Evangelien. Paulus zitiert in 1 Kor 15 eine Formel, die schon vor seinen Briefen existierte — ein Zeugnis aus den Anfängen der Christenheit.","bibelstelle":null,"bibellink":null}]},{"id":"jesu-worte","titel":"Jesu Worte","icon":"💬","farbe":"#16a085","zitate":[{"text":"„Kommt her zu mir, alle die ihr mühselig und beladen seid.“","quelle":"Mt 11,28","link":"https://www.die-bibel.de/bibel/BB/MAT.11.28-MAT.11.28"},{"text":"„Liebt einander, wie ich euch geliebt habe.“","quelle":"Joh 15,12","link":"https://www.die-bibel.de/bibel/BB/JHN.15.12-JHN.15.12"},{"text":"„Ich bin der Weg, die Wahrheit und das Leben.“","quelle":"Joh 14,6","link":"https://www.die-bibel.de/bibel/BB/JHN.14.6-JHN.14.6"},{"text":"„Euer Herz erschrecke nicht.“","quelle":"Joh 14,1","link":"https://www.die-bibel.de/bibel/BB/JHN.14.1-JHN.14.1"},{"text":"„Der Friede sei mit euch.“","quelle":"Joh 20,19","link":"https://www.die-bibel.de/bibel/BB/JHN.20.19-JHN.20.19"}],"fragen":[{"id":"jw1","typ":"luecke","schwierigkeit":1,"frage":"Liebt eure ___ und betet für die, die euch verfolgen. (Mt 5,44)","antworten":["Freunde","Feinde","Nächsten","Nachbarn"],"richtig":1,"erklaerung":"Liebt eure Feinde gehört zu den radikalsten Worten Jesu. Es steht im krassen Gegensatz zur Alltagslogik — und genau das macht es so herausfordernd. Feinde lieben bedeutet nicht, alles gutzuheißen oder sich alles gefallen zu lassen. Es bedeutet: Dem anderen seine Menschenwürde lassen — auch wenn er dir schadet.","bibelstelle":"Mt 5,44","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.5.44-MAT.5.44"},{"id":"jw2","typ":"multiple-choice","schwierigkeit":1,"frage":"Wie beginnt das Vaterunser?","antworten":["Gepriesen sei dein Name","Unser Vater im Himmel","Herr, erbarme dich","Ich glaube an Gott"],"richtig":1,"erklaerung":"Das Vaterunser ist das bekannteste Gebet der Christen, gelehrt von Jesus selbst. Es beginnt vertrauensvoll: Unser Vater. Das Vaterunser hat sieben Bitten. Die erste Hälfte dreht sich um Gott — sein Name, sein Reich, sein Wille. Erst dann kommen unsere Bedürfnisse. Das ist bezeichnend.","bibelstelle":"Mt 6,9","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.6.9-MAT.6.9"},{"id":"jw3","typ":"luecke","schwierigkeit":2,"frage":"Ich bin der ___, die Wahrheit und das Leben. (Joh 14,6)","antworten":["Hirte","Weg","Weinstock","Licht"],"richtig":1,"erklaerung":"Eines von sieben Ich-bin-Worten im Johannesevangelium. Jesus bezeichnet sich als den einzigen Zugang zu Gott dem Vater. Johannes hat sieben solcher Ich-bin-Worte: Brot, Licht, Tür, Hirte, Auferstehung, Weg, Weinstock. Sie alle antworten auf die Frage: Wer bist du eigentlich, Jesus?","bibelstelle":"Joh 14,6","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.14.6-JHN.14.6"},{"id":"jw4","typ":"multiple-choice","schwierigkeit":2,"frage":"Was meinte Jesus: Wo zwei oder drei in meinem Namen versammelt sind...?","antworten":["Gemeinde braucht mindestens 3 Mitglieder","Er ist mitten unter denen, die sich in seinem Namen treffen","Gebet wirkt nur in der Gruppe","Die Apostel vertreten ihn"],"richtig":1,"erklaerung":"Jesus verspricht seine Gegenwart in der kleinsten Gemeinschaft. Kirche beginnt nicht erst mit Gebäude und Pfarrer. Das ist eine Einladung: Keine Gemeinde ist zu klein, um Kirche zu sein. Zwei Menschen, die im Namen Jesu zusammenkommen, sind schon Kirche — mit Gottes Gegenwart.","bibelstelle":"Mt 18,20","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.18.20-MAT.18.20"},{"id":"jw5","typ":"multiple-choice","schwierigkeit":2,"frage":"Was antwortete Jesus auf die Frage nach dem wichtigsten Gebot?","antworten":["Die Zehn Gebote halten","Gott lieben und den Nächsten wie sich selbst","Täglich beten und fasten","In die Synagoge gehen"],"richtig":1,"erklaerung":"Das Doppelgebot der Liebe fasst für Jesus das ganze Gesetz zusammen: Gott lieben aus ganzem Herzen. Und den Nächsten wie sich selbst. Jesus verbindet zwei Verse, die im AT weit voneinander entfernt stehen. Das zeigt: Für ihn gehören Gottesliebe und Menschenliebe untrennbar zusammen.","bibelstelle":"Mt 22,37-39","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.22.37-MAT.22.39"},{"id":"jw6","typ":"luecke","schwierigkeit":3,"frage":"Was ihr dem ___ meiner Geschwister getan habt, das habt ihr mir getan. (Mt 25,40)","antworten":["Ältesten","Stärksten","Geringsten","Glücklichsten"],"richtig":2,"erklaerung":"Jesu Worte beim Weltgericht: Die entscheidende Frage ist nicht Frömmigkeit, sondern gelebte Nächstenliebe. Christus begegnet uns im Geringsten. Diese Szene ist kein Drohbild — sondern ein Liebesbild. Gott fragt nicht nach Kirchenmitgliedschaft, sondern: Hast du den Hunger gesehen? Den Durst? Die Einsamkeit?","bibelstelle":"Mt 25,40","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.25.40-MAT.25.40"},{"id":"jw7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint Jesus: Ich bin der wahre Weinstock (Joh 15,1)?","antworten":["Er lobt den Wein beim Abendmahl","Die Jünger sind auf ihn angewiesen wie Reben auf den Stock","Er ist König Israels","Er vergleicht sich mit dem Tempel"],"richtig":1,"erklaerung":"Nur wer in Jesus bleibt, trägt Frucht. Getrennt von ihm: nichts. Eine der stärksten Aussagen über Spiritualität im NT. Reben, die vom Stock abgetrennt sind, verdorren. Das Bild zeigt: Spiritualität ist keine Privatangelegenheit. Sie braucht die lebendige Verbindung zu Christus — und zur Gemeinschaft.","bibelstelle":"Joh 15,1","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.15.1-JHN.15.1"}]},{"id":"jesu-taten","titel":"Jesu Taten","icon":"🙌","farbe":"#d35400","zitate":[{"text":"„Bei Gott ist kein Ding unmöglich.“","quelle":"Lk 1,37","link":"https://www.die-bibel.de/bibel/BB/LUK.1.37-LUK.1.37"},{"text":"„Wenn ihr Glauben habt wie ein Senfkorn, werdet ihr zu diesem Berg sagen: Heb dich dorthin! — und er wird sich heben.“","quelle":"Mt 17,20","link":"https://www.die-bibel.de/bibel/BB/MAT.17.20-MAT.17.20"},{"text":"„Was ist das für ein Mensch, dass ihm sogar Wind und See gehorchen?“","quelle":"Mt 8,27","link":"https://www.die-bibel.de/bibel/BB/MAT.8.27-MAT.8.27"},{"text":"„Steh auf und geh — dein Glaube hat dich gerettet.“","quelle":"Lk 17,19","link":"https://www.die-bibel.de/bibel/BB/LUK.17.19-LUK.17.19"},{"text":"„Ich will es tun — sei rein!“","quelle":"Mk 1,41","link":"https://www.die-bibel.de/bibel/BB/MRK.1.41-MRK.1.41"}],"fragen":[{"id":"jt1","typ":"multiple-choice","schwierigkeit":1,"frage":"Was war Jesu erstes Wunder laut dem Johannesevangelium?","antworten":["Er heilte einen Blinden","Er verwandelte Wasser in Wein","Er speiste 5000 Menschen","Er weckte Lazarus auf"],"richtig":1,"erklaerung":"Bei der Hochzeit zu Kana verwandelte Jesus Wasser in Wein. Johannes nennt es das erste Zeichen Jesu. Johannes betont: Das Wasser wird nicht nur Wein — es wird überschwänglich viel Wein, etwa 600 Liter. Ein Zeichen: Gottes Gabe ist immer im Überfluss.","bibelstelle":"Joh 2,1-11","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.2.1-JHN.2.11"},{"id":"jt2","typ":"multiple-choice","schwierigkeit":1,"frage":"Wie viele Menschen speiste Jesus mit fünf Broten und zwei Fischen?","antworten":["500","1000","5000","12"],"richtig":2,"erklaerung":"Die Speisung der 5000 ist das einzige Wunder in allen vier Evangelien. Es erinnert an Gottes Speisung Israels in der Wüste. Zwölf Körbe blieben übrig — mehr als am Anfang da war. Das Wunder erzählt von Gottes Fülle: Es bleibt immer genug. Knappheit ist nicht Gottes letztes Wort.","bibelstelle":"Mk 6,41-44","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.6.41-MRK.6.44"},{"id":"jt3","typ":"multiple-choice","schwierigkeit":2,"frage":"Was tat Jesus bei der Stillung des Sturms?","antworten":["Er betete stundenlang","Er sprach den Wind an und es wurde still","Er ließ die Jünger allein","Er schwamm ans Ufer"],"richtig":1,"erklaerung":"Jesus spricht den Sturm an: Schweig, sei still! Das zeigt seine Autorität — und stellt die Frage: Wer ist dieser? Die Jünger fragen: Wer ist dieser? — genau die richtige Frage. Jesu Wunder laden immer zur Frage ein, wer er ist. Sie sind keine Vorführung, sondern eine Einladung.","bibelstelle":"Mk 4,39","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.4.39-MRK.4.39"},{"id":"jt4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wen erweckte Jesus von den Toten, bevor er selbst starb?","antworten":["Petrus Schwiegermutter","Zachäus","Lazarus","Jairus"],"richtig":2,"erklaerung":"Lazarus war bereits vier Tage tot. Jesus weinte am Grab und rief ihn zurück. Johannes erzählt dies als Vorzeichen der Auferstehung. Jesus weinte am Grab des Lazarus. Der Evangelist hält das fest: Er lässt uns nicht kalt. Gott leidet mit — das ist eine der tiefsten Aussagen des Johannesevangeliums.","bibelstelle":"Joh 11,43-44","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.11.43-JHN.11.44"},{"id":"jt5","typ":"multiple-choice","schwierigkeit":2,"frage":"Was meinte Jesus: Dein Glaube hat dir geholfen?","antworten":["Glaube hat magische Kräfte","Die Beziehung zu Gott heilt, nicht nur der Körper","Ungläubige werden nicht geheilt","Ärzte sind überflüssig"],"richtig":1,"erklaerung":"Jesus sieht den ganzen Menschen — Körper, Seele, Beziehung zu Gott. Die Verbindung von Heilung und Glaube ist kein Automatismus. Heilung bedeutet bei Jesus fast nie nur körperliche Wiederherstellung. Es ist Wiederherstellung des ganzen Menschen — seiner Würde, seiner Beziehungen, seiner Gottesnähe.","bibelstelle":"Mk 10,52","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.10.52-MRK.10.52"},{"id":"jt6","typ":"multiple-choice","schwierigkeit":3,"frage":"Welchen Begriff verwendet das Johannesevangelium statt Wunder?","antworten":["Wundertat","Zeichen","Kraftwerk","Heilung"],"richtig":1,"erklaerung":"Johannes nennt Jesu Wunder Zeichen (griech. semeia). Sie verweisen auf wer Jesus ist und was Gott durch ihn tut. Zeichen verweisen über sich hinaus. Wer nur das Wunder sieht, verpasst die Botschaft. Johannes fragt: Siehst du, wer hinter dem Zeichen steht?","bibelstelle":"Joh 2,11","bibellink":"https://www.die-bibel.de/bibel/BB/JHN.2.11-JHN.2.11"},{"id":"jt7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was zeigt Jesu Tempelreinigung?","antworten":["Dass er Kaufleute hasste","Er beanspruchte prophetische Autorität und schützte das Haus Gottes","Er war politischer Revolutionär","Er wollte den Opferkult abschaffen"],"richtig":1,"erklaerung":"Die Tempelreinigung ist eine prophetische Zeichenhandlung. Jesus tritt auf wie die Propheten des AT — im Namen Gottes. Jesus zitiert dabei Jesaja 56: Mein Haus soll ein Bethaus für alle Völker heißen. Er stellt sich in die prophetische Tradition — und nimmt Gottes Anspruch für den Tempel selbst in Anspruch.","bibelstelle":"Mk 11,15-17","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.11.15-MRK.11.17"}]},{"id":"gleichnisse","titel":"Gleichnisse Jesu","icon":"🌱","farbe":"#27ae60","zitate":[{"text":"„Das Himmelreich gleicht einem Senfkorn.“","quelle":"Mt 13,31","link":"https://www.die-bibel.de/bibel/BB/MAT.13.31-MAT.13.31"},{"text":"„Wer Ohren hat, der höre.“","quelle":"Mk 4,9","link":"https://www.die-bibel.de/bibel/BB/MRK.4.9-MRK.4.9"},{"text":"„Der Menschensohn ist gekommen zu suchen und zu retten, was verloren war.“","quelle":"Lk 19,10","link":"https://www.die-bibel.de/bibel/BB/LUK.19.10-LUK.19.10"},{"text":"„Das Himmelreich ist wie ein Netz, das ins Meer geworfen wird.“","quelle":"Mt 13,47","link":"https://www.die-bibel.de/bibel/BB/MAT.13.47-MAT.13.47"},{"text":"„Welche Frau, die zehn Silbermünzen hat, zündet nicht ein Licht an?“","quelle":"Lk 15,8","link":"https://www.die-bibel.de/bibel/BB/LUK.15.8-LUK.15.8"}],"fragen":[{"id":"gl1","typ":"multiple-choice","schwierigkeit":1,"frage":"Was ist ein Gleichnis?","antworten":["Ein Gebet in Versform","Eine bildhafte Geschichte, die eine geistliche Wahrheit zeigt","Eine historische Erzählung","Ein Zitat aus dem AT"],"richtig":1,"erklaerung":"Jesus erzählte Gleichnisse, um Wahrheiten über das Reich Gottes in Alltagsbildern greifbar zu machen. Das Wort Gleichnis kommt von gleichen: Etwas Bekanntes wird mit etwas Unbekanntem verglichen. Jesus nutzte Dinge aus dem Alltag seiner Zeit: Felder, Schafe, Sauerteig, Geld.","bibelstelle":null,"bibellink":null},{"id":"gl2","typ":"multiple-choice","schwierigkeit":1,"frage":"Gleichnis vom Verlorenen Sohn: Was tat der Vater, als er den Sohn von weitem sah?","antworten":["Er schloss die Tür","Er schickte Knechte","Er lief ihm entgegen und umarmte ihn","Er wartete schweigend"],"richtig":2,"erklaerung":"Gott wartet nicht, bis wir ankommen — er läuft uns entgegen. Ein Bild für bedingungslose Liebe. Der jüngere Sohn erwartet einen Dienstvertrag — er bekommt ein Fest. Das ist das Herz des Evangeliums: Gott empfängt uns als Kinder, nicht als Tagelöhner.","bibelstelle":"Lk 15,20","bibellink":"https://www.die-bibel.de/bibel/BB/LUK.15.20-LUK.15.20"},{"id":"gl3","typ":"multiple-choice","schwierigkeit":1,"frage":"Wer half dem Überfallenen auf dem Weg von Jerusalem nach Jericho?","antworten":["Ein Priester","Ein Levit","Ein Samariter","Ein römischer Soldat"],"richtig":2,"erklaerung":"Der Barmherzige Samariter ist eine Provokation: Samariter galten als Feinde. Genau dieser hilft — nicht die Frommen. Wer ist mein Nächster? Jesus erzählt das Gleichnis als Antwort auf die Frage: Wer ist mein Nächster? Die Antwort überrascht: Nächster sein ist keine Eigenschaft — es ist eine Entscheidung.","bibelstelle":"Lk 10,33-34","bibellink":"https://www.die-bibel.de/bibel/BB/LUK.10.33-LUK.10.34"},{"id":"gl4","typ":"luecke","schwierigkeit":2,"frage":"Im Gleichnis vom Sämann fiel ein Teil auf guten ___ und brachte reiche Frucht.","antworten":["Fels","Dornstrauch","Weg","Boden"],"richtig":3,"erklaerung":"Der gute Boden steht für aufmerksames Hören und Leben. Das Gleichnis erklärt, warum Gottes Wort unterschiedlich aufgenommen wird. Das Gleichnis gilt für jeden, der predigt oder lehrt: Nicht der Sämann versagt, wenn Samen nicht aufgeht — der Boden entscheidet. Das nimmt Druck weg.","bibelstelle":"Mk 4,8","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.4.8-MRK.4.8"},{"id":"gl5","typ":"multiple-choice","schwierigkeit":2,"frage":"Wofür steht das Gleichnis vom Schatz im Acker?","antworten":["Kluges Wirtschaften","Das Reich Gottes übertrifft alles andere und ist jeden Einsatz wert","Die Bedeutung von Besitz","Das Jüngste Gericht"],"richtig":1,"erklaerung":"Der Mann verkauft alles freudig, um das eine zu haben. Das Reich Gottes ist kein Verlust, sondern der größte Fund. Der Schatz wird mit Freude verkauft — nicht mit Verzicht. Das Reich Gottes ist kein Opfer, das wehtut. Es ist das Beste, was einem passieren kann.","bibelstelle":"Mt 13,44","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.13.44-MAT.13.44"},{"id":"gl6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was ist der Hauptpunkt des Gleichnisses vom Verlorenen Sohn?","antworten":["Gehorsam gegenüber dem Vater","Die bedingungslose Liebe Gottes, der jeden Umkehrenden empfängt","Die Ungerechtigkeit des älteren Bruders","Die Folgen von Verschwendung"],"richtig":1,"erklaerung":"Kern: Gott ist wie dieser Vater — er empfängt jeden, der umkehrt. Die Reaktion des älteren Bruders zeigt, wie schwer das anzunehmen ist. Der ältere Bruder steht für alle, die meinen, sie hätten es verdient. Die Frage an ihn — und an uns — ist offen: Kommst du rein? Das Ende des Gleichnisses ist unabgeschlossen.","bibelstelle":"Lk 15,22-24","bibellink":"https://www.die-bibel.de/bibel/BB/LUK.15.22-LUK.15.24"},{"id":"gl7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint Reich Gottes in Jesu Gleichnissen?","antworten":["Ein zukünftiges politisches Israel","Gottes Herrschaft, die in Jesus beginnt und vollendet wird","Die Kirche als Institution","Das Paradies nach dem Tod"],"richtig":1,"erklaerung":"Reich Gottes (griech. basileia) meint Gottes Herrschaft, kein Territorium. Sie beginnt mit Jesus, ist schon da und kommt zur Vollendung. Das Reich Gottes kommt klein und unscheinbar — wie ein Senfkorn, wie Sauerteig. Es drängt sich nicht auf. Aber es wächst. Das ist Jesu Grundvertrauen.","bibelstelle":"Mk 1,15","bibellink":"https://www.die-bibel.de/bibel/BB/MRK.1.15-MRK.1.15"}]},{"id":"gebote-bergpredigt","titel":"Gebote & Bergpredigt","icon":"⛰️","farbe":"#7f8c8d","zitate":[{"text":"„Was ihr getan habt einem meiner geringsten Geschwister, das habt ihr mir getan.“","quelle":"Mt 25,40","link":"https://www.die-bibel.de/bibel/BB/MAT.25.40-MAT.25.40"},{"text":"„Liebe Gott, deinen Herrn — und deinen Nächsten wie dich selbst.“","quelle":"Mk 12,30-31","link":"https://www.die-bibel.de/bibel/BB/MRK.12.30-MRK.12.31"},{"text":"„Bittet, so wird euch gegeben; suchet, so werdet ihr finden.“","quelle":"Mt 7,7","link":"https://www.die-bibel.de/bibel/BB/MAT.7.7-MAT.7.7"},{"text":"„Selig sind die Friedensstifter.“","quelle":"Mt 5,9","link":"https://www.die-bibel.de/bibel/BB/MAT.5.9-MAT.5.9"},{"text":"„Euer Ja sei ein Ja, euer Nein ein Nein.“","quelle":"Mt 5,37","link":"https://www.die-bibel.de/bibel/BB/MAT.5.37-MAT.5.37"}],"fragen":[{"id":"gb1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wie lautet das erste der Zehn Gebote?","antworten":["Du sollst nicht töten","Du sollst nicht lügen","Du sollst keine anderen Götter haben neben mir","Halte den Sabbat heilig"],"richtig":2,"erklaerung":"Das erste Gebot ist die Grundlage aller anderen: ausschließliche Bindung an Gott. Alles andere folgt daraus. Alle anderen Gebote setzen das erste voraus. Wer etwas anderes über alles stellt — Geld, Erfolg, Macht, Angst — macht es zum Gott. Das erste Gebot stellt die entscheidende Frage.","bibelstelle":"Ex 20,3","bibellink":"https://www.die-bibel.de/bibel/BB/EXO.20.3-EXO.20.3"},{"id":"gb2","typ":"luecke","schwierigkeit":1,"frage":"Ihr seid das ___ der Erde — und das ___ der Welt. (Mt 5,13-14)","antworten":["Brot und Wasser","Salz und Licht","Feuer und Weg","Fundament und Dach"],"richtig":1,"erklaerung":"Salz würzt und konserviert — Licht erhellt und führt. Beide Bilder beschreiben die Berufung der Christen für andere. Salz war in der Antike kostbar — es konservierte Lebensmittel. Licht in dunklen Häusern war lebensnotwendig. Beides sind keine dekorativen Bilder, sondern Aufgaben.","bibelstelle":"Mt 5,13-14","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.5.13-MAT.5.14"},{"id":"gb3","typ":"multiple-choice","schwierigkeit":1,"frage":"Wie beginnen die Seligpreisungen?","antworten":["Gelobt sei...","Selig sind...","Gesegnet werden...","Heil dem, der..."],"richtig":1,"erklaerung":"Selig sind... — Jesus erklärt für gesegnet, wen die Welt für Verlierer hält: die Trauernden, Sanftmütigen, die nach Gerechtigkeit Hungernden. Die Seligpreisungen sind keine Leistungsanforderungen. Jesus sagt nicht: Sei arm, dann wirst du selig. Er sagt: Diese Menschen — die die Welt vergisst — stehen bei Gott gut da.","bibelstelle":"Mt 5,3","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.5.3-MAT.5.3"},{"id":"gb4","typ":"multiple-choice","schwierigkeit":2,"frage":"Was meinte Jesus mit: Ihr habt gehört... ich aber sage euch?","antworten":["Er kritisiert das AT als falsch","Er vertieft die Gebote bis zur inneren Haltung","Er ersetzt Mose durch eigene Regeln","Er spricht nur zu den Aposteln"],"richtig":1,"erklaerung":"Jesus verschärft die Gebote: Nicht nur nicht töten — kein Hass im Herzen. Er geht bis zur Wurzel. Das zeigt prophetische Autorität. Jesus sagt: Ihr habt gehört: Du sollst nicht töten. Ich sage euch: Wer seinem Bruder zürnt... Das ist keine Erschwerung des Gesetzes, sondern eine Einladung zur Herzensveränderung.","bibelstelle":"Mt 5,21-22","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.5.21-MAT.5.22"},{"id":"gb5","typ":"luecke","schwierigkeit":2,"frage":"Die Goldene Regel: Alles, was ihr von anderen erwartet, das ___ auch ihnen. (Mt 7,12)","antworten":["schuldet","gebt","tut","sagt"],"richtig":2,"erklaerung":"Die Goldene Regel steht am Schluss der Bergpredigt. Jesus macht sie zum Herzstück christlicher Ethik. Die Goldene Regel steht in verschiedenen Formen in fast allen Kulturen und Religionen. Jesus macht sie zum aktiven Gebot: Nicht nur unterlassen — tun.","bibelstelle":"Mt 7,12","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.7.12-MAT.7.12"},{"id":"gb6","typ":"multiple-choice","schwierigkeit":3,"frage":"Welches Gebot nennt Jesus das wichtigste?","antworten":["Den Sabbat heiligen","Nicht töten","Gott lieben und den Nächsten wie sich selbst","Die Eltern ehren"],"richtig":2,"erklaerung":"Das Doppelgebot der Liebe fasst für Jesus das ganze Gesetz zusammen. Jesus verbindet Dtn 6,5 und Lev 19,18. Das Doppelgebot steht nicht im Zehn-Gebote-Text. Jesus kombiniert Dtn 6,5 und Lev 19,18 — zwei verschiedene Stellen. Das zeigt: Für Jesus ist die Bibel lebendig, nicht nur Buchstabe.","bibelstelle":"Mt 22,37-39","bibellink":"https://www.die-bibel.de/bibel/BB/MAT.22.37-MAT.22.39"},{"id":"gb7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint Luthers Formel: Du sollst Gott fürchten, lieben und vertrauen?","antworten":["Eine Ergänzung zum Bibeltext","Die Auslegung des ersten Gebots im Kleinen Katechismus","Ein Gebet aus dem Mittelalter","Einen Satz aus der Bergpredigt"],"richtig":1,"erklaerung":"Luther erklärt alle Gebote mit dem Dreiklang fürchten, lieben, vertrauen. Das erste Gebot ist für ihn der Schlüssel zu allem. Luther schrieb den Kleinen Katechismus 1529 — für Eltern, die ihren Kindern den Glauben erklären wollten. Er ist bis heute ein wichtiges Dokument lutherischer Frömmigkeit.","bibelstelle":null,"bibellink":null}]},{"id":"evangelische-kirche","titel":"Ev. Kirche & Reformation","icon":"🔨","farbe":"#8e44ad","zitate":[{"text":"„Hier stehe ich, ich kann nicht anders. Gott helfe mir.“","quelle":"Martin Luther, Worms 1521","link":"https://www.die-bibel.de/bibel/BB/ROM.1.17-ROM.1.17"},{"text":"„Der Gerechte wird aus Glauben leben.“","quelle":"Röm 1,17","link":"https://www.die-bibel.de/bibel/BB/ROM.1.17-ROM.1.17"},{"text":"„Zur Freiheit hat uns Christus befreit.“","quelle":"Gal 5,1","link":"https://www.die-bibel.de/bibel/BB/GAL.5.1-GAL.5.1"},{"text":"„Ihr seid ein auserwähltes Geschlecht, eine königliche Priesterschaft.“","quelle":"1 Petr 2,9","link":"https://www.die-bibel.de/bibel/BB/1PE.2.9-1PE.2.9"},{"text":"„Alles vermag ich durch den, der mich stärkt.“","quelle":"Phil 4,13","link":"https://www.die-bibel.de/bibel/BB/PHP.4.13-PHP.4.13"}],"fragen":[{"id":"ek1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wann veröffentlichte Luther seine 95 Thesen?","antworten":["1415","1517","1555","1648"],"richtig":1,"erklaerung":"Am 31. Oktober 1517 — heute Reformationstag — sandte Luther seine 95 Thesen an den Bischof. Sie entzündeten die Reformation. Luther schlug die Thesen nicht aus Rebellion an — er wollte eine akademische Debatte anstoßen. Dass daraus eine Revolution wurde, überraschte ihn zunächst selbst.","bibelstelle":null,"bibellink":null},{"id":"ek2","typ":"multiple-choice","schwierigkeit":1,"frage":"Was kritisierte Luther mit seinen 95 Thesen hauptsächlich?","antworten":["Den Papst persönlich","Den Ablasshandel — Sünden gegen Geld","Die lateinische Bibel","Die Klöster"],"richtig":1,"erklaerung":"Der Ablasshandel versprach Erlass von Sündenbußen gegen Geld. Für Luther: Gnade ist nicht käuflich. Johann Tetzel warb mit dem Spruch: Sobald das Geld im Kasten klingt, die Seele in den Himmel springt. Für Luther war das unerträglich: Gottes Gnade ist kein Produkt.","bibelstelle":null,"bibellink":null},{"id":"ek3","typ":"luecke","schwierigkeit":2,"frage":"Das reformatorische Grundprinzip: Allein die ___, allein die Gnade, allein der Glaube.","antworten":["Kirche","Vernunft","Schrift","Tradition"],"richtig":2,"erklaerung":"Sola scriptura, sola gratia, sola fide, solus Christus — vier Solas kennzeichnen evangelisches Denken. Allein die Schrift, allein die Gnade, allein der Glaube, allein Christus: Vier Aussagen, die zusammengehören.","bibelstelle":"Röm 1,17","bibellink":"https://www.die-bibel.de/bibel/BB/ROM.1.17-ROM.1.17"},{"id":"ek4","typ":"multiple-choice","schwierigkeit":2,"frage":"Welche Sakramente kennt die evangelische Kirche?","antworten":["Sieben wie die Katholische","Drei: Taufe, Abendmahl, Beichte","Zwei: Taufe und Abendmahl","Nur das Abendmahl"],"richtig":2,"erklaerung":"Luther reduzierte auf zwei: Taufe und Abendmahl — nur diese wurden von Jesus selbst eingesetzt. Besonders heftig war der Streit über das Abendmahl: Beim Marburger Gespräch 1529 prallten Luther und Zwingli aufeinander. Luther bestand auf der realen Gegenwart Christi im Brot, Zwingli sah es als Gedächtnismahl. Sie trennten sich unversöhnt.","bibelstelle":null,"bibellink":null},{"id":"ek5","typ":"multiple-choice","schwierigkeit":2,"frage":"Was ist die EKD?","antworten":["Eine ökumenische Weltorganisation","Dachverband evangelischer Landeskirchen in Deutschland","Die evangelische Kirche in der DDR","Ein Bibelübersetzungswerk"],"richtig":1,"erklaerung":"Die EKD (gegr. 1948) ist der Dachverband von 20 evangelischen Landeskirchen — darunter die EKBO in Berlin-Brandenburg. Die 20 Gliedkirchen reichen von Bayern bis Hamburg, von Württemberg bis Sachsen. Sie haben unterschiedliche Traditionen, aber gemeinsame Grundüberzeugungen.","bibelstelle":null,"bibellink":null},{"id":"ek6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was besagt der Augsburger Religionsfrieden von 1555?","antworten":["Die Reformation wurde verboten","Jeder Fürst bestimmt die Religion seines Landes","Alle Deutschen wurden evangelisch","Es gab eine gemeinsame Bibel"],"richtig":1,"erklaerung":"Cuius regio, eius religio — wessen Land, dessen Religion. Religionsfreiheit für Fürsten, noch nicht für Bürger. 1648 kam mehr. 1555 war ein erster Schritt — aber Andersgläubige, die nicht dem Fürsten entsprachen, mussten auswandern. Echte Religionsfreiheit für alle kam erst mit der Aufklärung.","bibelstelle":null,"bibellink":null},{"id":"ek7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint das Priestertum aller Gläubigen bei Luther?","antworten":["Alle sollen Pfarrer werden","Jeder Getaufte hat unmittelbaren Zugang zu Gott","Frauen dürfen predigen","Die Beichte ist abgeschafft"],"richtig":1,"erklaerung":"Durch die Taufe sind alle Christen Priester. Niemand braucht einen Mittler zwischen sich und Gott — das hat die Kirchenstruktur revolutioniert. Das Priestertum aller Gläubigen bedeutet auch: Du kannst für andere beten, anderen das Evangelium weitersagen, Trost spenden. Das ist nicht dem Pfarramt vorbehalten.","bibelstelle":"1 Petr 2,9","bibellink":"https://www.die-bibel.de/bibel/BB/1PE.2.9-1PE.2.9"}]},{"id":"nur-fuer-profis","titel":"Nur für Profis","icon":"🧠","farbe":"#1a1a2e","zitate":[{"text":"Wir sehen jetzt durch einen Spiegel in einem dunklen Wort.","quelle":"1 Kor 13,12","link":"https://www.die-bibel.de/bibel/BB/1CO.13.12-1CO.13.12"},{"text":"Meine Gedanken sind nicht eure Gedanken.","quelle":"Jes 55,8","link":"https://www.die-bibel.de/bibel/BB/ISA.55.8-ISA.55.8"},{"text":"Wer bist du, Mensch, dass du mit Gott rechten willst?","quelle":"Röm 9,20","link":"https://www.die-bibel.de/bibel/BB/ROM.9.20-ROM.9.20"},{"text":"Die Weisheit dieser Welt ist Torheit vor Gott.","quelle":"1 Kor 3,19","link":"https://www.die-bibel.de/bibel/BB/1CO.3.19-1CO.3.19"},{"text":"Gott hat die Weisheit dieser Welt zur Torheit gemacht.","quelle":"1 Kor 1,20","link":"https://www.die-bibel.de/bibel/BB/1CO.1.20-1CO.1.20"}],"fragen":[{"id":"pr1","typ":"multiple-choice","schwierigkeit":3,"frage":"Was beschreibt das Konzil von Chalcedon (451) über Jesus Christus?","antworten":["Jesus war nur ein Mensch","Jesus war nur Gott","Jesus ist wahrhaft Gott und wahrhaft Mensch in einer Person, unvermischt und ungetrennt","Jesus hatte einen menschlichen Körper aber eine göttliche Seele"],"richtig":2,"erklaerung":"Die Formel von Chalcedon ist das klassische christologische Bekenntnis: zwei Naturen, eine Person. Weder Vermischung noch Trennung. Diese Formel war das Ergebnis jahrhundertelanger heftiger Debatten — und sie bleibt ein Paradox, das den Verstand herausfordert.","bibelstelle":null,"bibellink":null},{"id":"pr2","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint der Begriff Hypostatische Union?","antworten":["Die Vereinigung von Christen verschiedener Konfessionen","Die Einheit von göttlicher und menschlicher Natur in der einen Person Jesu Christi","Die Verbindung von Seele und Körper beim Menschen","Die Trinität Gottes"],"richtig":1,"erklaerung":"Hypostasis (griech.) = Person. Die Lehre besagt: Göttlichkeit und Menschheit Jesu existieren in einer einzigen göttlichen Person. Kein Nebeneinander zweier Personen, kein Gemisch — sondern Einheit in Zweiheit. Theologisch einer der komplexesten Begriffe überhaupt.","bibelstelle":null,"bibellink":null},{"id":"pr3","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint apophatische Theologie?","antworten":["Theologie, die Gott durch Bibelzitate beschreibt","Theologie, die Gott nur durch Verneinung beschreibt: was Gott nicht ist","Theologie, die Gott als Vater betont","Theologie ohne Gebet"],"richtig":1,"erklaerung":"Via negativa: Da Gott jenseits aller menschlichen Begriffe ist, kann man nur sagen, was er nicht ist — nicht endlich, nicht leidend, nicht unwissend. Diese Tradition reicht von Pseudo-Dionysius bis zu modernen Theologen wie Dorothee Sölle.","bibelstelle":null,"bibellink":null},{"id":"pr4","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint Karl Barths Begriff des Deus absconditus in seiner Umformung?","antworten":["Gott ist verborgen hinter der Natur","Gott ist nur im gekreuzigten Christus offenbar — gerade in seiner Verborgenheit","Gott hat sich in der Moderne zurückgezogen","Gott ist das ganz Andere, über das man schweigen muss"],"richtig":1,"erklaerung":"Barth wendet Luther um: Der verborgene Gott ist nicht hinter der Offenbarung, sondern in ihr — im Kreuz. Gott offenbart sich gerade in dem, was dem Menschen schwach und töricht erscheint. Das ist Barths Anti-Natürliche-Theologie.","bibelstelle":null,"bibellink":null},{"id":"pr5","typ":"multiple-choice","schwierigkeit":3,"frage":"Was versteht man unter Perikhorese in der Trinitätslehre?","antworten":["Die Abfolge der Heilsgeschichte","Das gegenseitige Inwohnen der drei göttlichen Personen ineinander","Die Ausgießung des Geistes an Pfingsten","Die Einheit von Schöpfung und Erlösung"],"richtig":1,"erklaerung":"Perikhorese (griech. = Umtanz / gegenseitiges Durchdringen): Vater, Sohn und Geist durchdringen einander vollständig — sie sind unterschieden, aber nicht getrennt. Dieses Bild betont Gottes inneres Leben als Beziehung und Gemeinschaft.","bibelstelle":null,"bibellink":null},{"id":"pr6","typ":"multiple-choice","schwierigkeit":3,"frage":"Was ist der Unterschied zwischen Exegese und Eisegese?","antworten":["Exegese ist alt, Eisegese modern","Exegese legt aus, was im Text steht; Eisegese trägt eigene Meinungen in den Text hinein","Exegese ist evangelisch, Eisegese katholisch","Beide bezeichnen dasselbe"],"richtig":1,"erklaerung":"Hermeneutisch korrekt ist Exegese: den Text aus sich selbst heraus verstehen, in seinem historischen und literarischen Kontext. Eisegese ist die Versuchung jeder Predigt: den Text für eigene Zwecke einzuspannen. Die Grenze ist fließend — und deshalb so wichtig.","bibelstelle":null,"bibellink":null},{"id":"pr7","typ":"multiple-choice","schwierigkeit":3,"frage":"Was meint Luthers Unterscheidung von Gesetz und Evangelium?","antworten":["Gesetz = AT, Evangelium = NT","Gesetz entlarvt Sünde und treibt zur Verzweiflung; Evangelium schenkt Gnade und befreit","Gesetz ist für Böse, Evangelium für Gute","Gesetz ist Moral, Evangelium ist Mystik"],"richtig":1,"erklaerung":"Das ist Luthers hermeneutischer Schlüssel: Nicht zwei historische Abschnitte, sondern zwei Wirkweisen Gottes. Das Gesetz zeigt uns, was wir nicht sind — das Evangelium, was wir trotzdem sind: geliebt und angenommen. Diese Unterscheidung ist das Herzstück lutherischer Theologie.","bibelstelle":"Röm 3,28","bibellink":"ROM.3.28-ROM.3.28"}]},{"id":"gemeinde-geschichte","titel":"Gemeinde – Geschichte","icon":"🏛️","farbe":"#7f8c8d","zitate":[{"text":"„Die Steine schreien.“","quelle":"Lk 19,40","link":"https://www.die-bibel.de/bibel/BB/LUK.19.40-LUK.19.40"},{"text":"„Gedenke der vorigen Zeiten und betrachte die Jahre, von Geschlecht zu Geschlecht.“","quelle":"5 Mo 32,7","link":"https://www.die-bibel.de/bibel/BB/DEU.32.7-DEU.32.7"},{"text":"„Das ist der Tag, den der Herr gemacht hat; lasst uns freuen und fröhlich an ihm sein.“","quelle":"Ps 118,24","link":"https://www.die-bibel.de/bibel/BB/PSA.118.24-PSA.118.24"},{"text":"„Ich will euch eine Zukunft und eine Hoffnung geben.“","quelle":"Jer 29,11","link":"https://www.die-bibel.de/bibel/BB/JER.29.11-JER.29.11"},{"text":"„Erzählt es euren Kindern, und eure Kinder ihren Kindern.“","quelle":"Joel 1,3","link":"https://www.die-bibel.de/bibel/BB/JOL.1.3-JOL.1.3"}],"fragen":[{"id":"gg1","typ":"multiple-choice","schwierigkeit":1,"frage":"Aus welchem Jahrhundert stammt die Dorfkirche Alt-Staaken ursprünglich?","antworten":["16. Jahrhundert","14. Jahrhundert","18. Jahrhundert","12. Jahrhundert"],"richtig":1,"erklaerung":"Die Dorfkirche Alt-Staaken wurde im frühen 14. Jahrhundert als rechteckiger Saalbau errichtet — sie ist damit eines der ältesten Gebäude im heutigen Spandau. Viele Generationen haben in ihr gebetet, geheiratet und Abschied genommen.","bibelstelle":null,"bibellink":null},{"id":"gg2","typ":"multiple-choice","schwierigkeit":1,"frage":"Wann wurde die Zuversichtskirche eingeweiht?","antworten":["1953","1961","1966","1978"],"richtig":2,"erklaerung":"Am 29. Mai 1966 wurde die Zuversichtskirche eingeweiht — entworfen von den Architekten Barbara und Wolfgang Vogt aus Kiel. Bemerkenswert: Der Bau wurde bereits im Juli 1961 beschlossen, unmittelbar vor dem Mauerbau!","bibelstelle":null,"bibellink":null},{"id":"gg3","typ":"multiple-choice","schwierigkeit":2,"frage":"Was passierte mit der Dorfkirche Alt-Staaken nach dem Mauerbau 1961?","antworten":["Sie wurde geschlossen und versiegelt","Fast das gesamte Inventar wurde entfernt","Sie wurde zur Lagerhalle umgebaut","Sie blieb unverändert erhalten"],"richtig":1,"erklaerung":"Die Dorfkirche lag in unmittelbarer Grenznähe zur Berliner Mauer. Unter dem Leitbild 'Neue Sachlichkeit' wurde fast das gesamte historische Inventar entfernt. Jahrzehntelang waren größere Umgestaltungspläne nicht umsetzbar. Erst 2000–2002 wurde die Kirche umfassend renoviert.","bibelstelle":null,"bibellink":null},{"id":"gg4","typ":"multiple-choice","schwierigkeit":2,"frage":"Aus welchem besonderen Material wurde die Kirche Gartenstadt gebaut?","antworten":["Aus importierten Natursteinen","Aus Klinkersteinen eines abgerissenen Gebäudes","Aus Beton und Stahl","Aus Holz und Backstein"],"richtig":1,"erklaerung":"Die Kirche Gartenstadt wurde aus Klinkersteinen gebaut, die aus einem abgerissenen Gebäude geborgen wurden — ein frühes Beispiel für nachhaltiges Bauen! Die schlichte, klare Bauweise harmoniert bewusst mit der denkmalgeschützten Gartenstadtsiedlung.","bibelstelle":null,"bibellink":null},{"id":"gg5","typ":"multiple-choice","schwierigkeit":2,"frage":"Wann wurde die Gemeinde Heerstraße Nord gegründet?","antworten":["1. Januar 1966","1. Januar 1969","30. Mai 1971","1. Januar 1976"],"richtig":1,"erklaerung":"Die Gemeinde Heerstraße Nord wurde am 1. Januar 1969 gegründet. Die ersten Versammlungen fanden ab 1970 in einem angemieteten Ladenlokal statt. Das Gemeindehaus (heute Ernst-Lange-Haus) wurde am 30. Mai 1971 eingeweiht — von Bischof Kurt Scharf persönlich.","bibelstelle":null,"bibellink":null},{"id":"gg6","typ":"multiple-choice","schwierigkeit":3,"frage":"Mit welcher Gemeinde in Afrika pflegt Staaken eine offizielle Partnerschaft — seit 1982?","antworten":["Nairobi, Kenia","Kana in Tanga, Tansania","Kapstadt, Südafrika","Accra, Ghana"],"richtig":1,"erklaerung":"Seit 1982 verbindet die Gemeinde Staaken eine offizielle Partnerschaft mit der Gemeinde Kana in Tanga, Tansania. Die ersten Kontakte gab es schon 1966–1970 durch Gerda Nitschke. 1979 besuchte die erste Reisegruppe Tansania, 1990 wurde dort eine Kirche in Kisosora eingeweiht.","bibelstelle":null,"bibellink":null},{"id":"gg7","typ":"multiple-choice","schwierigkeit":3,"frage":"Wann wurde die Dorfkirche Alt-Staaken zuletzt umfassend renoviert und wer leitete das Projekt?","antworten":["1989, Architekt Helmut Jahn","1995, Architekt Norman Foster","2000–2002, Prof. Dr. Karsten Westphal","2010–2012, Architekt Daniel Libeskind"],"richtig":2,"erklaerung":"Von 2000 bis 2002 wurde die Dorfkirche Alt-Staaken umfassend renoviert und neu gestaltet — unter Leitung von Prof. Dr. Karsten Westphal. Zur Ausstattung gehören ein Wandbild 'Versöhnte Einheit' des Künstlers Gabriele Mucchi sowie Glasfenster von Helge Warme.","bibelstelle":null,"bibellink":null}]},{"id":"gemeinde-aktuell","titel":"Gemeinde – Aktuell","icon":"🕊️","farbe":"#27ae60","zitate":[{"text":"„Einer trage des anderen Last.“","quelle":"Gal 6,2","link":"https://www.die-bibel.de/bibel/BB/GAL.6.2-GAL.6.2"},{"text":"„Wo zwei oder drei in meinem Namen versammelt sind, bin ich mitten unter ihnen.“","quelle":"Mt 18,20","link":"https://www.die-bibel.de/bibel/BB/MAT.18.20-MAT.18.20"},{"text":"„Diene einander, jeder mit der Gabe, die er empfangen hat.“","quelle":"1 Petr 4,10","link":"https://www.die-bibel.de/bibel/BB/1PE.4.10-1PE.4.10"},{"text":"„Ihr seid das Licht der Welt.“","quelle":"Mt 5,14","link":"https://www.die-bibel.de/bibel/BB/MAT.5.14-MAT.5.14"},{"text":"„Lasst uns Gutes tun an jedermann, allermeist aber an den Glaubensgenossen.“","quelle":"Gal 6,10","link":"https://www.die-bibel.de/bibel/BB/GAL.6.10-GAL.6.10"}],"fragen":[{"id":"ga1","typ":"multiple-choice","schwierigkeit":1,"frage":"Wie viele Predigtorte (Kirchengebäude) hat die Evangelische Kirchengemeinde Staaken?","antworten":["2","3","4","6"],"richtig":3,"erklaerung":"Die Gemeinde hat sechs Standorte: Dorfkirche Alt-Staaken, Zuversichtskirche, Kirche Gartenstadt, Kirche Heerstraße Nord, Ernst-Lange-Haus und das Waldhaus am Sonnenhügel. Jeder Ort hat seinen eigenen Charakter und seine eigene Gemeinde.","bibelstelle":null,"bibellink":null},{"id":"ga2","typ":"multiple-choice","schwierigkeit":1,"frage":"Welches soziale Angebot gibt es jeden Donnerstag im Ernst-Lange-Haus?","antworten":["Suppenküche","Laib & Seele – Lebensmittelausgabe","Kleiderkammer","Hausaufgabenhilfe"],"richtig":1,"erklaerung":"'Laib & Seele' gibt es seit dem 21. April 2005 jeden Donnerstag von 12:30 bis 15 Uhr im Pillnitzer Weg 8. Für einen kleinen Beitrag von 2 Euro erhalten Bedürftige Lebensmittel. Das Angebot wird von Ehrenamtlichen getragen — Kirche, die sich kümmert.","bibelstelle":null,"bibellink":null},{"id":"ga3","typ":"multiple-choice","schwierigkeit":2,"frage":"Wer ist der Vorsitzende des Gemeindekirchenrats (GKR) der Evangelischen Kirchengemeinde Staaken?","antworten":["Viktor Weber","Heike Everth","Stefan Pfeiffer","Carsten Albrecht"],"richtig":2,"erklaerung":"Stefan Pfeiffer ist der Vorsitzende des Gemeindekirchenrats (GKR). Er führt zusammen mit 8 gewählten Ehrenamtlichen und den drei Pfarrpersonen die Gemeinde. Der GKR trifft sich monatlich, um alle wichtigen Entscheidungen zu treffen.","bibelstelle":null,"bibellink":null},{"id":"ga4","typ":"multiple-choice","schwierigkeit":2,"frage":"Wie viele Pfarrerinnen und Pfarrer hat die Evangelische Kirchengemeinde Staaken?","antworten":["1","2","3","4"],"richtig":2,"erklaerung":"Die Gemeinde hat drei Pfarrpersonen: Pfr. Viktor Weber, Pfrn. Heike Everth (zugleich stellvertretende GKR-Vorsitzende) und Pfr. Johannes Herzer. Zusammen begleiten sie die Menschen in den verschiedenen Stadtteilen und Standorten.","bibelstelle":null,"bibellink":null},{"id":"ga5","typ":"multiple-choice","schwierigkeit":2,"frage":"Was ist das Café Pi8?","antworten":["Ein Jugendclub im Keller der Dorfkirche","Ein nachhaltiges Gemeindecafé im Ernst-Lange-Haus","Ein Bibelkreis mit Kaffee und Kuchen","Der Spitzname des Kirchenmusikers"],"richtig":1,"erklaerung":"Das Café Pi8 im Ernst-Lange-Haus (Pillnitzer Weg 8 — daher 'Pi8') öffnete am 10. Juni 2013. Es wird von Ehrenamtlichen geführt, kocht frisch, nachhaltig, regional und saisonal. Geöffnet: Mo 10–14 Uhr, Di–Fr 10–18 Uhr. Und es ist barrierefrei.","bibelstelle":null,"bibellink":null},{"id":"ga6","typ":"multiple-choice","schwierigkeit":3,"frage":"Wie viele Chöre und Vokalensembles gibt es in der Gemeinde Staaken?","antworten":["2","3","5","7"],"richtig":2,"erklaerung":"Die Gemeinde hat fünf Ensembles: Kantorei Staaken, Capella Vocale, Chor in der Gartenstadt, Voices of Garden Town und den Kinderchor. Dazu kommt noch der Instrumentalkreis. Kirchenmusik ist in Staaken eine echte Herzensangelegenheit!","bibelstelle":null,"bibellink":null},{"id":"ga7","typ":"multiple-choice","schwierigkeit":3,"frage":"Welches besondere monatliche Gottesdienstformat bietet die Gemeinde freitagabends an?","antworten":["Gospel Night","Music and Spirit Night","Open Church","Nightfever"],"richtig":1,"erklaerung":"Die 'Music and Spirit Night' findet monatlich freitags um 19 Uhr im Ernst-Lange-Haus statt — mit Band, Musik und einem Gast-Talk. Ein Format, das Gottesdienst und Konzert verbindet und auch Menschen anspricht, die sonst eher selten in die Kirche kommen.","bibelstelle":null,"bibellink":null}]}]};;</script>
