name: Supabase Keepalive

on:
  schedule:
    # Jeden Montag und Donnerstag — verhindert die automatische Pausierung nach 7 Tagen Inaktivität
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://jhelduwnmjpomzrowgmr.supabase.co/rest/v1/scores?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZWxkdXdubWpwb216cm93Z21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNzQ4NDEsImV4cCI6MjA5NTc1MDg0MX0.-Mv6TRBTgJhqjaLARs3hvLm6vvMcnQ2mlfubgLvriyU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZWxkdXdubWpwb216cm93Z21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNzQ4NDEsImV4cCI6MjA5NTc1MDg0MX0.-Mv6TRBTgJhqjaLARs3hvLm6vvMcnQ2mlfubgLvriyU")
          echo "Supabase antwortete mit HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::warning::Supabase-Ping fehlgeschlagen (HTTP $code) — Projekt evtl. pausiert, bitte im Dashboard prüfen."
          fi
